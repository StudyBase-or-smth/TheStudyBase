<!-- ── Quiz engine ──
     Home page lists quizzes from storage/manifest.json grouped by subject. Choosing a
     section loads that quiz JSON and walks its questions in order.

     Question types:
       - Multiple choice, single answer: isMultipleChoice: true, isCheckbox: false (or omitted) → radio group
       - Multiple choice, multi-select:   isMultipleChoice: true, isCheckbox: true              → checkboxes
       - Math / fill-in-the-blank:        math: true → one textbox per entry in "answers",
         each worth 1 mark, graded independently (numeric-aware) against answers[i].text.
       - Dictionary number textbox:       dictionary: "<id>" (no isMultipleChoice/math/isAICheck)
         → one numeric textbox, graded against the correct dictionary number(s).
       - Dictionary multiple choice:      dictionary: "<id>" + isMultipleChoice: true
         → radio/checkbox of dictionary numbers (answers[].text is the number).
         Any question with `dictionary` also shows that dictionary's title,
         section subtitles, and numbered formulae on the right.
         Dictionary files live in storage/dictionaries/<id>.json.

     manifest.json is a list of { file, name, subject, section } entries — "file" is the
     quiz filename in this folder, "name" is the paper title, "subject" groups the home
     page (Engineering, Maths, …), and "section" is Section I / II / Practice. -->
<script>
const STORAGE_FOLDER = 'storage';
const DICTIONARY_FOLDER = 'storage/dictionaries';
const SUBJECT_META = {
  Engineering: { emoji: '⚙️', colour: '#1a588e' },
  Maths: { emoji: '📐', colour: 'rgb(79, 142, 205)' },
  Mathematics: { emoji: '📐', colour: 'rgb(79, 142, 205)' },
  English: { emoji: '📖', colour: '#9f1239' },
  Electrotechnology: { emoji: '⚡', colour: '#0f766e' },
  Economics: { emoji: '📊', colour: '#0c8247' },
  Physics: { emoji: '🧪', colour: '#0dbb07' }
};
let quizState = null;
let quizManifest = []; // [{file, name, subject, section, questionCount, totalMarks}, ...]
const dictionaryCache = Object.create(null);
const QUIZ_PROGRESS_KEY = 'studybase_hsc_progress';

function subjectMeta(name) {
  return SUBJECT_META[name] || { emoji: '📚', colour: '#4f46e5' };
}

function normalizeManifestEntry(entry) {
  if (typeof entry === 'string') {
    return { file: entry, name: entry, subject: 'Other', section: '' };
  }
  return {
    file: entry.file,
    name: entry.name || entry.file,
    subject: entry.subject || 'Other',
    section: entry.section || ''
  };
}

async function ensureDictionary(id) {
  if (!id) return null;
  if (dictionaryCache[id] && dictionaryCache[id] !== 'failed') return dictionaryCache[id];
  const res = await fetch(`${DICTIONARY_FOLDER}/${encodeURIComponent(id)}.json`);
  if (!res.ok) throw new Error(`Could not load dictionary "${id}"`);
  const data = await res.json();
  dictionaryCache[id] = data;
  return data;
}

function dictionaryEntries(dict) {
  if (!dict || !dict.entries) return [];
  if (Array.isArray(dict.entries)) return dict.entries;
  return Object.keys(dict.entries).map(id => {
    const v = dict.entries[id];
    if (v && typeof v === 'object') return { id, ...v };
    return { id, name: String(v), section: '', formula: '' };
  });
}

function dictionaryEntry(dict, num) {
  const key = String(num).trim();
  return dictionaryEntries(dict).find(e => String(e.id) === key) || null;
}

function dictionaryEntryLabel(dict, num) {
  const e = dictionaryEntry(dict, num);
  if (!e) return '';
  return e.formula || '';
}

function isDictionaryNumberQuestion(q) {
  return !!q.dictionary && !q.isMultipleChoice && !q.math && !q.isAICheck;
}

function dictionaryCorrectNumbers(q) {
  return (q.answers || [])
    .filter(a => a && a.correct !== false)
    .map(a => String(a.text).trim())
    .filter(Boolean);
}

function paintQuiz(wrapHtml, q) {
  const canvas = document.getElementById('hscCanvas');
  if (q && q.dictionary) {
    canvas.innerHTML = `<div class="quiz-stage has-dictionary">${wrapHtml}<aside class="quiz-dictionary" id="quizDictionary"></aside></div>`;
    fillDictionaryPanel(q);
  } else {
    canvas.innerHTML = wrapHtml;
  }
}

function fillDictionaryPanel(q) {
  const panel = document.getElementById('quizDictionary');
  if (!panel) return;
  const dict = dictionaryCache[q.dictionary];
  if (!dict || dict === 'failed' || typeof dict !== 'object') {
    panel.innerHTML = `<div class="quiz-status quiz-error">Could not load dictionary "${escapeHtml(q.dictionary)}".</div>`;
    return;
  }

  const title = document.createElement('h2');
  title.className = 'quiz-dictionary-title';
  title.textContent = dict.title || dict.name || 'Formula sheet';
  panel.appendChild(title);

  const locked = !!(quizState && quizState.perQuestion[quizState.index]);

  let currentSection = null;
  let sectionEl = null;
  let entriesEl = null;
  dictionaryEntries(dict).forEach(entry => {
    const sectionName = entry.section || '';
    if (!sectionEl || sectionName !== currentSection) {
      currentSection = sectionName;
      sectionEl = document.createElement('div');
      sectionEl.className = 'quiz-dictionary-section';
      if (sectionName) {
        const h = document.createElement('h3');
        h.className = 'quiz-dictionary-section-title';
        h.textContent = sectionName;
        sectionEl.appendChild(h);
      }
      entriesEl = document.createElement('div');
      entriesEl.className = 'quiz-dictionary-entries';
      sectionEl.appendChild(entriesEl);
      panel.appendChild(sectionEl);
    }

    const row = document.createElement('button');
    row.type = 'button';
    row.className = 'quiz-dictionary-row';
    row.dataset.dictId = String(entry.id ?? '');
    row.title = `Insert ${entry.id}`;
    if (locked) row.disabled = true;

    if (entry.formula) {
      const formulaEl = document.createElement('span');
      formulaEl.className = 'quiz-dictionary-formula';
      formulaEl.textContent = entry.formula;
      row.appendChild(formulaEl);
    }
    const num = document.createElement('span');
    num.className = 'quiz-dictionary-num';
    num.textContent = String(entry.id ?? '');
    row.appendChild(num);
    row.addEventListener('click', () => insertDictionaryNumber(entry.id));
    entriesEl.appendChild(row);
  });
  syncDictionaryPicked();
}

// Clicking a formula on the sheet fills the current question: the number
// textbox, a matching multiple-choice option, or the focused/next math box.
function insertDictionaryNumber(id) {
  if (!quizState || quizState.perQuestion[quizState.index]) return;
  const canvas = document.getElementById('hscCanvas');
  if (!canvas) return;
  const num = String(id);
  const q = quizState.questions[quizState.index];

  const dictInput = canvas.querySelector('#dictNumberInput');
  if (dictInput && !dictInput.disabled) {
    dictInput.value = num;
    dictInput.focus();
    syncDictionaryPicked();
    return;
  }

  if (q.isMultipleChoice) {
    const idx = q.answers.findIndex(a => String(a.text).trim() === num);
    if (idx < 0) return;
    const input = canvas.querySelector(`input[name="quizAnswer"][value="${idx}"]`);
    if (!input || input.disabled) return;
    input.checked = q.isCheckbox ? !input.checked : true;
    selectAnswer();
    syncDictionaryPicked();
    return;
  }

  const mathInputs = [...canvas.querySelectorAll('.quiz-math-input:not(#dictNumberInput)')]
    .filter(el => !el.disabled);
  if (mathInputs.length) {
    const active = mathInputs.find(el => el === document.activeElement);
    const empty = mathInputs.find(el => el.value.trim() === '');
    const target = active || empty || mathInputs[mathInputs.length - 1];
    target.value = num;
    target.focus();
    syncDictionaryPicked();
  }
}

function syncDictionaryPicked() {
  const canvas = document.getElementById('hscCanvas');
  if (!canvas || !quizState) return;
  const picked = new Set();
  const dictInput = canvas.querySelector('#dictNumberInput');
  if (dictInput && dictInput.value.trim()) picked.add(dictInput.value.trim());
  canvas.querySelectorAll('input[name="quizAnswer"]:checked').forEach(inp => {
    const a = quizState.questions[quizState.index].answers[parseInt(inp.value, 10)];
    if (a) picked.add(String(a.text).trim());
  });
  canvas.querySelectorAll('.quiz-math-input:not(#dictNumberInput)').forEach(el => {
    if (el.value.trim()) picked.add(el.value.trim());
  });
  canvas.querySelectorAll('.quiz-dictionary-row').forEach(row => {
    row.classList.toggle('is-picked', picked.has(row.dataset.dictId));
  });
}

function revealDictionaryAnswerLabels(canvas, q) {
  const dict = dictionaryCache[q.dictionary];
  if (!dict || !q.answers) return;
  canvas.querySelectorAll('.quiz-answer').forEach((label, i) => {
    const num = q.answers[i] && q.answers[i].text;
    const name = dictionaryEntryLabel(dict, num);
    const textEl = label.querySelector('.quiz-answer-text');
    if (textEl && name) textEl.textContent = `${num} — ${name}`;
  });
}

async function loadManifest() {
  const manifestRes = await fetch(`${STORAGE_FOLDER}/manifest.json`);
  if (!manifestRes.ok) throw new Error('Could not load storage/manifest.json');
  const manifest = await manifestRes.json();
  if (!Array.isArray(manifest) || manifest.length === 0) {
    throw new Error('manifest.json has no quiz files listed');
  }

  quizManifest = manifest.map(normalizeManifestEntry);

  await Promise.all(quizManifest.map(async (entry) => {
    try {
      const res = await fetch(`${STORAGE_FOLDER}/${entry.file}`);
      if (!res.ok) throw new Error(`Could not load ${entry.file}`);
      const data = await res.json();
      const questions = Array.isArray(data.questions) ? data.questions : [];
      entry.questionCount = questions.length;
      entry.totalMarks = questions.reduce((sum, q) => sum + marksForQuestion(q), 0);
    } catch (err) {
      entry.questionCount = null;
      entry.totalMarks = null;
      entry.loadError = err.message;
    }
  }));
}

function quizHashFile() {
  return decodeURIComponent((location.hash || '').replace(/^#/, ''));
}

function setQuizHash(file) {
  const desired = file
    ? location.pathname + location.search + '#' + encodeURIComponent(file)
    : location.pathname + location.search;
  if (location.pathname + location.search + location.hash !== desired) {
    history.replaceState(null, '', desired);
  }
}

async function bootHsc() {
  const canvas = document.getElementById('hscCanvas');
  canvas.innerHTML = '<div class="quiz-status">Loading quizzes…</div>';
  try {
    await loadManifest();
    const hashFile = quizHashFile();
    const entry = hashFile && quizManifest.find(m => m.file === hashFile);
    if (entry) await loadQuizByFile(entry.file, entry.name, { resume: true });
    else showQuizHome();
  } catch (err) {
    canvas.innerHTML = `<div class="quiz-status quiz-error">Error loading quizzes: ${escapeHtml(err.message)}</div>`;
  }
}

function groupedHomePapers(entries) {
  const papers = [];
  const indexByKey = Object.create(null);
  entries.forEach(entry => {
    const key = entry.subject + '\0' + entry.name;
    if (indexByKey[key] == null) {
      indexByKey[key] = papers.length;
      papers.push({ subject: entry.subject, name: entry.name, sections: [] });
    }
    papers[indexByKey[key]].sections.push(entry);
  });
  return papers;
}

function uniqueSubjects() {
  const seen = [];
  quizManifest.forEach(m => {
    if (!seen.includes(m.subject)) seen.push(m.subject);
  });
  return seen;
}

function homePaperId(paper) {
  return 'home-paper-' + encodeURIComponent(paper.subject + '::' + paper.name);
}

function paperKey(paper) {
  if (!paper) return '';
  return paper.subject + '::' + paper.name;
}

function readProgressStore() {
  try {
    const raw = localStorage.getItem(QUIZ_PROGRESS_KEY);
    const data = raw ? JSON.parse(raw) : {};
    return data && typeof data === 'object' && !Array.isArray(data) ? data : {};
  } catch {
    return {};
  }
}

function writeProgressStore(store) {
  try {
    localStorage.setItem(QUIZ_PROGRESS_KEY, JSON.stringify(store));
  } catch {
    /* quota / private mode — progress just will not persist */
  }
}

function getPaperProgress(paper) {
  const key = paperKey(paper);
  if (!key) return null;
  return readProgressStore()[key] || null;
}

function cloneSavedAnswers(saved, length) {
  if (!Array.isArray(saved) || saved.length !== length) return null;
  try {
    const copy = JSON.parse(JSON.stringify(saved));
    return copy.map(p => {
      if (!p || typeof p !== 'object' || typeof p.earned !== 'number' || typeof p.total !== 'number') return null;
      return p;
    });
  } catch {
    return null;
  }
}

function paperHasProgress(paper) {
  const prog = getPaperProgress(paper);
  if (!prog) return false;
  if (prog.atSummary) return true;
  if ((prog.index || 0) > 0) return true;
  const byFile = prog.perQuestionByFile || {};
  if (Object.keys(byFile).some(file => Array.isArray(byFile[file]) && byFile[file].some(Boolean))) return true;
  const first = paper.sections && paper.sections[0];
  return !!(first && prog.file && prog.file !== first.file);
}

function currentQuizHasProgress() {
  if (!quizState) return false;
  if (quizState.atSummary) return true;
  if (quizState.index > 0) return true;
  if (quizState.perQuestion.some(Boolean)) return true;
  const entry = quizManifest.find(m => m.file === quizState.filename);
  if (!entry) return false;
  const first = quizManifest.find(m => m.subject === entry.subject && m.name === entry.name);
  return !!(first && first.file !== quizState.filename);
}

function persistCurrentQuiz() {
  if (!quizState) return;
  const entry = quizManifest.find(m => m.file === quizState.filename);
  if (!entry) return;
  const key = paperKey(entry);
  const store = readProgressStore();
  const prev = store[key] || {};
  store[key] = {
    file: quizState.filename,
    index: quizState.index,
    atSummary: !!quizState.atSummary,
    perQuestionByFile: {
      ...(prev.perQuestionByFile || {}),
      [quizState.filename]: quizState.perQuestion
    }
  };
  writeProgressStore(store);
}

function clearPaperProgress(paper) {
  const key = paperKey(paper);
  if (!key) return;
  const store = readProgressStore();
  delete store[key];
  writeProgressStore(store);
}

function startPaper(paper) {
  const start = paper.sections[0];
  if (!start || start.loadError) return;
  loadQuizByFile(start.file, start.name);
}

function restartPaper(paper) {
  const start = paper.sections[0];
  if (!start || start.loadError) return;
  loadQuizByFile(start.file, start.name, { reset: true });
}

function continuePaper(paper) {
  const prog = getPaperProgress(paper);
  const savedFile = prog && prog.file;
  const entry = (savedFile && paper.sections.find(s => s.file === savedFile)) || paper.sections[0];
  if (!entry || entry.loadError) return;
  loadQuizByFile(entry.file, entry.name, { resume: true });
}

function locateHomeTarget(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function showQuizHome() {
  if (currentQuizHasProgress()) persistCurrentQuiz();
  quizState = null;
  setQuizHash('');
  updateHscBreadcrumb(null);
  renderHomePage();
  renderHomeSidebar();
}

function renderHomePage() {
  const canvas = document.getElementById('hscCanvas');
  const subjects = uniqueSubjects();

  const subjectBlocks = subjects.map(subject => {
    const meta = subjectMeta(subject);
    const papers = groupedHomePapers(quizManifest.filter(e => e.subject === subject));
    const quizCount = papers.reduce((n, p) => n + p.sections.length, 0);
    const paperBlocks = papers.map(paper => {
      const rows = paper.sections.map(() =>
        `<div class="quiz-section-row">
          <span class="quiz-section-name"></span>
          <span class="quiz-section-stats"></span>
        </div>`
      ).join('');
      const inProgress = paperHasProgress(paper);
      const head = inProgress
        ? `<div class="quiz-paper-head is-split">
            <div class="quiz-paper-name"></div>
            <div class="quiz-paper-actions">
              <button type="button" class="quiz-restart-btn">Restart</button>
              <button type="button" class="quiz-continue-btn">Continue →</button>
            </div>
          </div>`
        : `<button type="button" class="quiz-paper-head">
            <div class="quiz-paper-name"></div>
            <span class="quiz-section-go">Start →</span>
          </button>`;
      return `<div class="quiz-paper-block" id="${homePaperId(paper)}">
        ${head}
        ${rows}
      </div>`;
    }).join('');

    return `<article class="quiz-paper-card" id="home-subject-${encodeURIComponent(subject)}" style="border-top:4px solid ${meta.colour}">
      <div class="quiz-home-subject-head">
        <span class="quiz-home-subject-emoji">${meta.emoji}</span>
        <span class="quiz-home-subject-name"></span>
        <span class="quiz-home-subject-count">${quizCount} quiz${quizCount === 1 ? '' : 'zes'}</span>
      </div>
      ${paperBlocks}
    </article>`;
  }).join('');

  canvas.innerHTML = `
    <div class="quiz-home">
      <h1 class="quiz-home-title">Quiz Tool</h1>
      <p class="quiz-home-lead">Start a paper from its title. If it has more than one section, they run in order.</p>
      ${subjectBlocks || '<p class="quiz-home-empty">No quizzes yet.</p>'}
    </div>`;

  canvas.querySelectorAll('.quiz-paper-card').forEach((card, i) => {
    card.querySelector('.quiz-home-subject-name').textContent = subjects[i];
  });

  const papersFlat = subjects.flatMap(subject => groupedHomePapers(quizManifest.filter(e => e.subject === subject)));
  canvas.querySelectorAll('.quiz-paper-block').forEach((block, i) => {
    const paper = papersFlat[i];
    block.querySelector('.quiz-paper-name').textContent = paper.name;
    const start = paper.sections[0];
    if (start && !start.loadError) {
      const restartBtn = block.querySelector('.quiz-restart-btn');
      const continueBtn = block.querySelector('.quiz-continue-btn');
      if (restartBtn && continueBtn) {
        restartBtn.addEventListener('click', () => restartPaper(paper));
        continueBtn.addEventListener('click', () => continuePaper(paper));
      } else {
        block.querySelector('.quiz-paper-head').addEventListener('click', () => startPaper(paper));
      }
    }
    block.querySelectorAll('.quiz-section-row').forEach((row, j) => {
      const sec = paper.sections[j];
      row.querySelector('.quiz-section-name').textContent = sec.section || 'Quiz';
      const qLabel = sec.questionCount == null
        ? (sec.loadError || 'Could not load')
        : `${sec.questionCount} question${sec.questionCount === 1 ? '' : 's'}`;
      const mLabel = sec.totalMarks == null ? '' : ` · ${sec.totalMarks} mark${sec.totalMarks === 1 ? '' : 's'}`;
      row.querySelector('.quiz-section-stats').textContent = qLabel + mLabel;
    });
  });
}

function renderHomeSidebar() {
  const sidebar = document.getElementById('quizSidebar');
  if (!sidebar) return;
  const subjects = uniqueSubjects();

  const rows = subjects.map(subject => {
    const papers = groupedHomePapers(quizManifest.filter(m => m.subject === subject));
    const paperRows = papers.map(paper => {
      const sectionLabel = paper.sections.length === 1
        ? (paper.sections[0].section || 'Quiz')
        : `${paper.sections.length} sections`;
      return `<div class="topic-item-wrap" data-target="${homePaperId(paper)}" data-search="${escapeHtml((paper.name + ' ' + paper.subject + ' ' + paper.sections.map(s => s.section).join(' ')).toLowerCase())}">
        <div class="topic-item">
          <div class="ti-top"><div class="ti-name"><span class="ti-name-text"></span></div></div>
          <div class="ti-unit"></div>
        </div>
      </div>`;
    }).join('');
    return `<div class="home-nav-subject" data-subject="${escapeHtml(subject)}">
      <div class="unit-label"></div>
      ${paperRows}
    </div>`;
  }).join('');

  sidebar.innerHTML = `
    <div class="sidebar-top">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input class="search-input" type="text" id="quizSearchInput" placeholder="Find a quiz…">
      </div>
    </div>
    <div class="topic-list" id="quizNavList">${rows}</div>
  `;

  sidebar.querySelectorAll('.home-nav-subject').forEach((block, i) => {
    const subject = subjects[i];
    block.querySelector('.unit-label').textContent = subject;
    block.querySelector('.unit-label').addEventListener('click', () => {
      locateHomeTarget('home-subject-' + encodeURIComponent(subject));
    });
    const papers = groupedHomePapers(quizManifest.filter(m => m.subject === subject));
    block.querySelectorAll('.topic-item-wrap').forEach((wrap, j) => {
      const paper = papers[j];
      wrap.querySelector('.ti-name-text').textContent = paper.name;
      wrap.querySelector('.ti-unit').textContent = paper.sections.length === 1
        ? (paper.sections[0].section || 'Quiz')
        : `${paper.sections.length} sections`;
      wrap.addEventListener('click', () => locateHomeTarget(wrap.getAttribute('data-target')));
    });
  });

  sidebar.querySelector('#quizSearchInput').addEventListener('input', (e) => filterHomeNav(e.target.value));
}

function filterHomeNav(query) {
  const needle = query.trim().toLowerCase();
  document.querySelectorAll('#quizNavList .home-nav-subject').forEach(block => {
    let any = false;
    block.querySelectorAll('.topic-item-wrap').forEach(wrap => {
      const hay = wrap.getAttribute('data-search') || '';
      const show = needle === '' || hay.includes(needle);
      wrap.style.display = show ? '' : 'none';
      if (show) any = true;
    });
    block.style.display = any ? '' : 'none';
  });
}

function updateHscBreadcrumb(entry) {
  const el = document.getElementById('hdrBreadcrumb');
  if (!el) return;
  el.innerHTML = '';

  const addSep = () => {
    const sep = document.createElement('span');
    sep.className = 'bc-sep';
    sep.textContent = '›';
    el.appendChild(sep);
  };

  const indexLink = document.createElement('a');
  indexLink.className = 'bc-link';
  indexLink.href = '../index.html';
  indexLink.textContent = 'Index';
  el.appendChild(indexLink);
  addSep();

  if (!entry) {
    const current = document.createElement('span');
    current.className = 'bc-current';
    current.textContent = 'HSC';
    el.appendChild(current);
    return;
  }

  const hscBtn = document.createElement('button');
  hscBtn.type = 'button';
  hscBtn.className = 'bc-link';
  hscBtn.id = 'bcHscHome';
  hscBtn.textContent = 'HSC';
  hscBtn.addEventListener('click', showQuizHome);
  el.appendChild(hscBtn);
  addSep();

  const quizName = entry.name || entry.subject || 'Quiz';
  const sectionName = entry.section || '';

  if (!sectionName) {
    const current = document.createElement('span');
    current.className = 'bc-current';
    current.textContent = quizName;
    el.appendChild(current);
    return;
  }

  const quizEl = document.createElement('span');
  quizEl.className = 'bc-link';
  quizEl.textContent = quizName;
  el.appendChild(quizEl);
  addSep();

  const current = document.createElement('span');
  current.className = 'bc-current';
  current.textContent = sectionName;
  el.appendChild(current);
}

async function loadQuizByFile(file, name, opts = {}) {
  const canvas = document.getElementById('hscCanvas');
  canvas.innerHTML = '<div class="quiz-status">Loading quiz…</div>';
  try {
    const quizRes = await fetch(`${STORAGE_FOLDER}/${file}`);
    if (!quizRes.ok) throw new Error(`Could not load ${file}`);
    const quizData = await quizRes.json();

    if (!Array.isArray(quizData.questions) || quizData.questions.length === 0) {
      throw new Error(`${file} has no questions`);
    }

    const totalMarks = quizData.questions.reduce((sum, q) => sum + marksForQuestion(q), 0);
    const entry = quizManifest.find(m => m.file === file);
    if (opts.reset && entry) clearPaperProgress(entry);

    let index = 0;
    let atSummary = false;
    let perQuestion = new Array(quizData.questions.length).fill(null);
    if (opts.resume && entry) {
      const prog = getPaperProgress(entry);
      if (prog) {
        const restored = cloneSavedAnswers(prog.perQuestionByFile && prog.perQuestionByFile[file], quizData.questions.length);
        if (restored) perQuestion = restored;
        if (prog.file === file) {
          index = Math.min(Math.max(0, prog.index || 0), quizData.questions.length - 1);
          atSummary = !!prog.atSummary;
        }
      }
    }

    quizState = {
      questions: quizData.questions,
      filename: file,
      quizName: name || file,
      index,
      atSummary,
      // One slot per question: null until answered, then { earned, total, selected | values }
      // — used both for scoring (no more running accumulator to double-count) and to redraw
      // a question exactly as the student left it when they jump back to it via the sidebar.
      perQuestion,
      totalMarks
    };

    const dictIds = [...new Set(quizData.questions.map(q => q.dictionary).filter(Boolean))];
    await Promise.all(dictIds.map(id => ensureDictionary(id).catch(() => { dictionaryCache[id] = 'failed'; })));

    setQuizHash(file);
    updateHscBreadcrumb(entry || { subject: name, section: '', name });
    if (atSummary) {
      renderSidebar();
      renderSummary();
    } else {
      renderQuestion();
    }
  } catch (err) {
    canvas.innerHTML = `<div class="quiz-status quiz-error">Error loading quiz: ${escapeHtml(err.message)}</div>`;
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function getEarnedMarks() {
  return quizState.perQuestion.reduce((sum, p) => sum + (p ? p.earned : 0), 0);
}

function renderQuestion() {
  quizState.atSummary = false;
  renderSidebar();

  const { questions, index } = quizState;
  if (index >= questions.length) {
    renderSummary();
    return;
  }

  const q = questions[index];
  const prior = quizState.perQuestion[index]; // null if not yet answered

  if (q.math) {
    renderMathQuestion(q, index, questions.length, prior);
  } else if (q.isAICheck) {
    renderAICheckQuestion(q, index, questions.length, prior);
  } else if (isDictionaryNumberQuestion(q)) {
    renderDictionaryNumberQuestion(q, index, questions.length, prior);
  } else {
    renderChoiceQuestion(q, index, questions.length, prior);
  }
}

// Marks for one question, regardless of type — kept as a single function so
// the sidebar list and the totalMarks sum can never disagree with each other.
function marksForQuestion(q) {
  if (q.math) return q.answers.length;
  if (q.isAICheck) return q.marks;
  if (isDictionaryNumberQuestion(q)) return 1;
  return 1;
}

/* ── Sidebar: quiz-file picker + searchable per-question nav list ──
   Reuses the app's real subject-page components (mainstyle.css, scoped to
   body.subject-page, which this page already is): .search-input for the filter box,
   .unit-label/.unit-select for the quiz-file dropdown (relabeled "Quiz" here instead
   of "Units"), and .topic-item/.ti-top/.ti-name/.ti-unit for each question row — same
   look as the topic list on subject.html, just pointed at questions instead of topics. */

function renderSidebar() {
  const sidebar = document.getElementById('quizSidebar');
  if (!sidebar || !quizState) return;

  const entry = quizManifest.find(m => m.file === quizState.filename);
  const playingName = entry
    ? (entry.section ? `${entry.name} · ${entry.section}` : entry.name)
    : quizState.quizName;

  const rows = quizState.questions.map((q, i) => {
    const prior = quizState.perQuestion[i];
    const marks = marksForQuestion(q);
    const activeClass = i === quizState.index ? ' active' : '';

    let badge = '';
    if (prior) {
      if (prior.earned === prior.total) badge = `<span class="quiz-nav-delta up">▲${prior.total}</span>`;
      else if (prior.earned === 0) badge = `<span class="quiz-nav-delta down">▼${prior.total}</span>`;
      else badge = `<span class="quiz-nav-delta partial">${prior.earned}/${prior.total}</span>`;
    }

    return `
      <div class="topic-item-wrap" data-idx="${i}">
        <div class="topic-item${activeClass}">
          <div class="ti-top">
            <div class="ti-name"><span class="ti-name-text"></span></div>
            ${badge}
          </div>
          <div class="ti-unit">${marks} ${marks === 1 ? 'mark' : 'marks'}</div>
        </div>
      </div>`;
  }).join('');

  sidebar.innerHTML = `
    <button type="button" class="quiz-back-btn" id="quizHomeBtn">← All quizzes</button>
    <div class="quiz-now-playing"><strong></strong><span class="quiz-now-sub"></span></div>
    <div class="sidebar-top">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input class="search-input" type="text" id="quizSearchInput" placeholder="Search questions…">
      </div>
    </div>
    <div style="display:flex;border-top:1px solid var(--border);border-bottom:1px solid var(--border)">
      <div style="padding:4px 16px;border-right:1px solid var(--border);font-size:11px;color:var(--muted2)">
        <strong style="color:var(--accent)">${quizState.questions.length}</strong> questions
      </div>
      <div style="padding:4px 16px;font-size:11px;color:var(--muted2)">
        <strong style="color:var(--accent)">${quizState.totalMarks}</strong> marks
      </div>
    </div>
    <div class="topic-list" id="quizNavList">${rows}</div>
  `;

  sidebar.querySelector('#quizHomeBtn').addEventListener('click', showQuizHome);
  sidebar.querySelector('.quiz-now-playing strong').textContent = playingName;
  if (entry) sidebar.querySelector('.quiz-now-sub').textContent = entry.subject;

  sidebar.querySelectorAll('#quizNavList .topic-item-wrap').forEach((wrap, i) => {
    wrap.querySelector('.ti-name-text').textContent = quizState.questions[i].name;
    wrap.addEventListener('click', () => jumpToQuestion(i));
  });

  sidebar.querySelector('#quizSearchInput').addEventListener('input', (e) => filterQuestionNav(e.target.value));
}

// Live-filters the question nav list by number, heading, or question text.
function filterQuestionNav(query) {
  const needle = query.trim().toLowerCase();
  document.querySelectorAll('#quizNavList .topic-item-wrap').forEach(wrap => {
    const i = parseInt(wrap.getAttribute('data-idx'), 10);
    const q = quizState.questions[i];
    const haystack = `${q.id} ${q.name} ${q.question || ''}`.toLowerCase();
    wrap.style.display = (needle === '' || haystack.includes(needle)) ? '' : 'none';
  });
}

function jumpToQuestion(i) {
  quizState.index = i;
  quizState.atSummary = false;
  persistCurrentQuiz();
  renderQuestion();
}

/* ── Multiple choice / checkbox ── */

function renderChoiceQuestion(q, index, total, prior) {
  const canvas = document.getElementById('hscCanvas');
  // Radios for single-answer questions (native, mutually exclusive via shared `name`),
  // checkboxes for multi-answer questions (native, independent toggles).
  const inputType = q.isCheckbox ? 'checkbox' : 'radio';
  const answerButtons = q.answers.map((a, i) =>
    `<label class="quiz-answer" data-idx="${i}">
       <input type="${inputType}" name="quizAnswer" value="${i}" onchange="selectAnswer()">
       <span class="quiz-answer-text"></span>
     </label>`
  ).join('');

  paintQuiz(`
    <div class="quiz-wrap">
      <div class="quiz-progress">Question ${index + 1} of ${total} of "${escapeHtml(quizState.quizName || '')}"</div>
      <div class="quiz-heading">
        <span class="quiz-heading-name"></span>
        <span class="quiz-heading-marks">(1 mark)</span>
      </div>
      <div class="quiz-stem"></div>
      <div class="quiz-image-wrap" id="quizImageWrap"></div>
      <div class="quiz-type-hint">${q.dictionary && q.isMultipleChoice ? '# Choose the number from the sheet' : (q.isCheckbox ? '☑ Select all that apply' : '◉ Choose one answer')}</div>
      <div class="quiz-answers">${answerButtons}</div>
      <div class="quiz-feedback" id="quizFeedback"></div>
      <div class="quiz-actions">
        <button class="quiz-btn quiz-btn-primary" id="quizSubmitBtn" onclick="submitAnswer()">Submit</button>
        <button class="quiz-btn" id="quizNextBtn" style="display:none" onclick="nextQuestion()">Next →</button>
      </div>
    </div>
  `, q);

  // Set text content via textContent (not innerHTML) so quiz content can never inject markup.
  // `question` is the exam wording; `name` is the short heading ("Question 11"). Older quiz
  // files without a `question` field fall back to showing `name` as the stem, no heading.
  renderHeadingAndStem(canvas, q);
  renderQuestionImage(q, canvas);
  canvas.querySelectorAll('.quiz-answer').forEach((label, i) => {
    label.querySelector('.quiz-answer-text').textContent = q.answers[i].text;
  });

  // Already answered on a previous visit (jumped back here via the sidebar) — redraw the
  // locked, graded state instead of a fresh editable form, so nothing can be re-submitted.
  if (prior) {
    applyChoiceGrading(canvas, q, new Set(prior.selected));
    showFeedback(canvas, prior.earned, prior.total);
    document.getElementById('quizSubmitBtn').style.display = 'none';
    revealAdvanceButton();
  }
}

function selectAnswer() {
  // Resync the 'selected' style class from whatever is currently checked —
  // works the same for radios (browser auto-unchecks the rest of the group)
  // and checkboxes (each toggles independently).
  document.querySelectorAll('.quiz-answer').forEach(label => {
    const input = label.querySelector('input');
    label.classList.toggle('selected', input.checked);
  });
}

// Locks the answer list, colors it, and returns marks earned (0 or 1). Shared between a
// live submit and redrawing a previously-answered question from stored state.
function applyChoiceGrading(canvas, q, selectedIdxs) {
  const correctIdxs = new Set(
    q.answers.map((a, i) => a.correct ? i : null).filter(v => v !== null)
  );
  const isCorrect = correctIdxs.size === selectedIdxs.size &&
    [...correctIdxs].every(i => selectedIdxs.has(i));

  canvas.querySelectorAll('.quiz-answer').forEach((label, i) => {
    label.classList.add('locked');
    const input = label.querySelector('input');
    input.checked = selectedIdxs.has(i);
    input.disabled = true;
    if (correctIdxs.has(i)) label.classList.add('correct');
    else if (selectedIdxs.has(i)) label.classList.add('incorrect');
  });

  if (q.dictionary) {
    revealDictionaryAnswerLabels(canvas, q);
    syncDictionaryPicked();
  }

  return isCorrect ? 1 : 0;
}

// `note` is optional extra text appended after the mark line — used by the
// AI-check flow to show Gemini's actual feedback sentence, not just the score.
function showFeedback(canvas, earned, total, note) {
  const feedback = canvas.querySelector('#quizFeedback');
  if (!feedback) return;
  const markWord = total === 1 ? 'mark' : 'marks';
  let text = total === 1
    ? (earned === 1 ? 'Correct! (1/1 mark)' : 'Not quite (0/1 mark) — correct answer(s) highlighted above.')
    : `${earned} / ${total} ${markWord} for this question`;
  if (note) text += ` — ${note}`;
  feedback.textContent = text;
  feedback.className = 'quiz-feedback ' + (earned === total ? 'quiz-correct' : (earned > 0 ? 'quiz-partial' : 'quiz-incorrect'));
}

function submitAnswer() {
  if (quizState.perQuestion[quizState.index]) return; // already answered — ignore stray resubmits

  const checkedInputs = document.querySelectorAll('input[name="quizAnswer"]:checked');
  if (checkedInputs.length === 0) return;

  const selectedIdxs = new Set([...checkedInputs].map(inp => parseInt(inp.value, 10)));
  const q = quizState.questions[quizState.index];
  const canvas = document.getElementById('hscCanvas');

  const earned = applyChoiceGrading(canvas, q, selectedIdxs);
  quizState.perQuestion[quizState.index] = { earned, total: 1, selected: [...selectedIdxs] };
  persistCurrentQuiz();

  showFeedback(canvas, earned, 1);
  document.getElementById('quizSubmitBtn').style.display = 'none';
  revealAdvanceButton();
  renderSidebar(); // reflect the new correct/partial/incorrect color on this question's nav button
}

/* ── Dictionary number textbox ──
   q.dictionary names a file in storage/dictionaries/. The student types the
   red number from that sheet. answers[].text (where correct !== false) is the
   accepted number — usually one. Multiple-choice dictionary questions reuse
   renderChoiceQuestion; this path is the simple numeric textbox. */

function renderDictionaryNumberQuestion(q, index, total, prior) {
  const canvas = document.getElementById('hscCanvas');
  paintQuiz(`
    <div class="quiz-wrap">
      <div class="quiz-progress">Question ${index + 1} of ${total} of "${escapeHtml(quizState.quizName || '')}"</div>
      <div class="quiz-heading">
        <span class="quiz-heading-name"></span>
        <span class="quiz-heading-marks">(1 mark)</span>
      </div>
      <div class="quiz-stem"></div>
      <div class="quiz-image-wrap" id="quizImageWrap"></div>
      <div class="quiz-type-hint"># Enter the number from the sheet</div>
      <div class="quiz-math-answers">
        <div class="quiz-math-group">
          <div class="quiz-math-group-label">Sheet number</div>
          <div class="quiz-math-input-rows">
            <div class="quiz-math-input-row" id="dictNumberRow">
              <input type="text" class="quiz-math-input" id="dictNumberInput" inputmode="numeric" placeholder="e.g. 5" autocomplete="off">
              <span class="quiz-math-mark-label">1 mark</span>
            </div>
          </div>
        </div>
      </div>
      <div class="quiz-feedback" id="quizFeedback"></div>
      <div class="quiz-actions">
        <button class="quiz-btn quiz-btn-primary" id="quizSubmitBtn" onclick="submitDictionaryNumber()">Submit</button>
        <button class="quiz-btn" id="quizNextBtn" style="display:none" onclick="nextQuestion()">Next →</button>
      </div>
    </div>
  `, q);

  renderHeadingAndStem(canvas, q);
  renderQuestionImage(q, canvas);

  const input = canvas.querySelector('#dictNumberInput');
  if (input) {
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); submitDictionaryNumber(); }
    });
    input.addEventListener('input', syncDictionaryPicked);
  }

  if (prior) {
    applyDictionaryNumberGrading(canvas, q, prior.value || '');
    showFeedback(canvas, prior.earned, 1);
    document.getElementById('quizSubmitBtn').style.display = 'none';
    revealAdvanceButton();
  }
}

function applyDictionaryNumberGrading(canvas, q, given) {
  const row = canvas.querySelector('#dictNumberRow');
  const input = canvas.querySelector('#dictNumberInput');
  if (input) {
    input.value = given;
    input.disabled = true;
  }
  const correct = dictionaryCorrectNumbers(q);
  const ok = correct.some(c => valuesMatch(given, c));
  if (row) row.classList.add(ok ? 'correct' : 'incorrect');
  syncDictionaryPicked();

  const dict = dictionaryCache[q.dictionary];
  const labelled = correct.map(n => {
    const name = dictionaryEntryLabel(dict, n);
    return name ? `${n} — ${name}` : n;
  }).join(', ');
  if (!ok && labelled) {
    const hint = document.createElement('div');
    hint.className = 'quiz-math-hint';
    hint.textContent = `Correct: ${labelled}`;
    const groupEl = canvas.querySelector('.quiz-math-group');
    if (groupEl) groupEl.appendChild(hint);
  }
  return ok ? 1 : 0;
}

function submitDictionaryNumber() {
  if (quizState.perQuestion[quizState.index]) return;

  const q = quizState.questions[quizState.index];
  const canvas = document.getElementById('hscCanvas');
  const input = canvas.querySelector('#dictNumberInput');
  const given = (input && input.value || '').trim();
  if (given === '') return;

  const earned = applyDictionaryNumberGrading(canvas, q, given);
  quizState.perQuestion[quizState.index] = { earned, total: 1, value: given };
  persistCurrentQuiz();

  showFeedback(canvas, earned, 1);
  document.getElementById('quizSubmitBtn').style.display = 'none';
  revealAdvanceButton();
  renderSidebar();
}

/* ── Math / fill-in-the-blank ── */

// Groups consecutive same-type entries in a math question's `answers` array
// (e.g. two "working" entries in a row → one group; used by both rendering
// and grading, so the two always agree on what counts as one card/group).
function groupMathAnswers(answers) {
  const groups = [];
  answers.forEach((a, i) => {
    const type = a.type === 'working' ? 'working' : 'answer';
    const last = groups[groups.length - 1];
    if (last && last.type === type) {
      last.items.push(i);
    } else {
      groups.push({ type, items: [i] });
    }
  });
  return groups;
}

function renderMathQuestion(q, index, total, prior) {
  const canvas = document.getElementById('hscCanvas');
  // Each entry defaults to type "answer" if not set (keeps older question files working
  // unchanged). "working" entries behave identically for grading — same textbox, same
  // numeric-aware matching, same 1 mark — just grouped/labeled as working steps.
  //
  // Consecutive entries of the same type are grouped into one card (e.g. two "working"
  // entries in a row become a single "Working" card with two stacked textboxes), rather
  // than one card per entry. Boxes within a group are interchangeable at grading time —
  // see submitMathAnswer — so a student can fill working steps in any order.
  const groups = groupMathAnswers(q.answers);

  const rows = groups.map((g, gi) => {
    const isWorking = g.type === 'working';
    const label = isWorking ? 'Working' : (g.items.length > 1 ? 'Answers' : 'Answer');
    const placeholder = isWorking ? 'Show your working' : 'Your answer';
    // data-item is the index into q.answers this row corresponds to — lets us read/restore
    // a flat, ordered "given values" array regardless of how rows are grouped into cards.
    const inputRows = g.items.map(itemIdx =>
      `<div class="quiz-math-input-row" data-group="${gi}" data-item="${itemIdx}">
         <input type="text" class="quiz-math-input" placeholder="${placeholder}" autocomplete="off">
         <span class="quiz-math-mark-label">1 mark</span>
       </div>`
    ).join('');
    return `<div class="quiz-math-group${isWorking ? ' quiz-math-working' : ''}" data-group="${gi}">
       <div class="quiz-math-group-label">${label}</div>
       <div class="quiz-math-input-rows">${inputRows}</div>
     </div>`;
  }).join('');

  const markWord = q.answers.length === 1 ? 'mark' : 'marks';

  paintQuiz(`
    <div class="quiz-wrap">
      <div class="quiz-progress">Question ${index + 1} of ${total} of "${escapeHtml(quizState.quizName || '')}"</div>
      <div class="quiz-heading">
        <span class="quiz-heading-name"></span>
        <span class="quiz-heading-marks">(${q.answers.length} ${markWord})</span>
      </div>
      <div class="quiz-stem"></div>
      <div class="quiz-image-wrap" id="quizImageWrap"></div>
      <div class="quiz-math-answers">${rows}</div>
      <div class="quiz-feedback" id="quizFeedback"></div>
      <div class="quiz-actions">
        <button class="quiz-btn quiz-btn-primary" id="quizSubmitBtn" onclick="submitMathAnswer()">Submit</button>
        <button class="quiz-btn" id="quizNextBtn" style="display:none" onclick="nextQuestion()">Next →</button>
      </div>
    </div>
  `, q);

  renderHeadingAndStem(canvas, q);
  renderQuestionImage(q, canvas);

  if (prior) {
    applyMathGrading(canvas, q, prior.values);
    showFeedback(canvas, prior.earned, q.answers.length);
    document.getElementById('quizSubmitBtn').style.display = 'none';
    revealAdvanceButton();
  }
}

/* ── Shared: heading + stem ──
   q.name is the short exam-style heading ("Question 11"); q.question is the full
   wording. Older quiz files (no `question` field) fall back to showing `name` as
   the stem with no separate heading, so they still render sensibly. Set via
   textContent (not innerHTML) so quiz content can never inject markup. */
function renderHeadingAndStem(container, q) {
  const headingEl = container.querySelector('.quiz-heading');
  const nameEl = container.querySelector('.quiz-heading-name');
  const stemEl = container.querySelector('.quiz-stem');

  if (q.question) {
    if (nameEl) nameEl.textContent = q.name;
    if (stemEl) stemEl.textContent = q.question;
  } else {
    if (headingEl) headingEl.style.display = 'none';
    if (stemEl) stemEl.textContent = q.name;
  }
}

/* ── Shared: optional question image ──
   q.image is a filename/path relative to STORAGE_FOLDER (e.g. "diagram.png" or
   "images/q3.png"). Set via property assignment (not string-interpolated into HTML)
   so a filename can never inject markup. Falls back to a visible error if it 404s. */
function renderQuestionImage(q, container) {
  const wrap = container.querySelector('#quizImageWrap');
  if (!wrap || !q.image) return;

  const img = document.createElement('img');
  img.className = 'quiz-image';
  img.alt = q.question || q.name || 'Question image';
  img.title = 'Click to toggle dark-mode inversion';
  img.src = `${STORAGE_FOLDER}/${q.image}`;
  img.onerror = () => {
    const err = document.createElement('div');
    err.className = 'quiz-status quiz-error';
    err.textContent = `Could not load image: ${q.image}`;
    img.replaceWith(err);
  };
  // Inverted by default in dark mode (mainstyle.css's global img filter);
  // click flips it back to normal colours and back again — same behaviour
  // as the topic PDF/Image viewer's toggleImgInvert().
  img.onclick = () => img.classList.toggle('no-invert');
  wrap.appendChild(img);
}

function valuesMatch(given, expected) {
  const g = String(given).trim();
  const e = String(expected).trim();
  if (g === '') return false;
  const gn = Number(g), en = Number(e);
  if (g !== '' && e !== '' && !isNaN(gn) && !isNaN(en)) return gn === en;
  return g.toLowerCase() === e.toLowerCase();
}

// Finds the best pairing between the boxes a student filled in and the group's
// expected values — each box can match any not-yet-used expected value, not just
// the one at the same position. Returns, per given[i], the index into expected[]
// it was matched to (or -1 if unmatched). Standard augmenting-path bipartite
// matching; group sizes here are tiny (a handful of boxes) so this is instant.
function bestMatch(given, expected) {
  const expectedOwner = new Array(expected.length).fill(-1); // expected idx -> given idx currently matched
  function tryAugment(gi, visited) {
    for (let ei = 0; ei < expected.length; ei++) {
      if (visited[ei] || !valuesMatch(given[gi], expected[ei])) continue;
      visited[ei] = true;
      if (expectedOwner[ei] === -1 || tryAugment(expectedOwner[ei], visited)) {
        expectedOwner[ei] = gi;
        return true;
      }
    }
    return false;
  }
  for (let gi = 0; gi < given.length; gi++) {
    tryAugment(gi, new Array(expected.length).fill(false));
  }
  const givenMatch = new Array(given.length).fill(-1);
  expectedOwner.forEach((gi, ei) => { if (gi !== -1) givenMatch[gi] = ei; });
  return givenMatch;
}

// Fills/locks/colors the input rows from a flat "given values" array (one entry per
// q.answers index) and returns marks earned. Shared between a live submit (values read
// from the inputs) and redrawing a previously-answered question (values read from
// stored per-question state) — both go through the exact same grading logic.
function applyMathGrading(canvas, q, valuesFlat) {
  const groups = groupMathAnswers(q.answers);
  let earned = 0;

  groups.forEach((g, gi) => {
    const rows = [...canvas.querySelectorAll(`.quiz-math-input-row[data-group="${gi}"]`)];
    const inputs = rows.map(row => row.querySelector('.quiz-math-input'));
    const given = g.items.map(idx => valuesFlat[idx] ?? '');
    const expected = g.items.map(idx => q.answers[idx].text);

    // Any box may match any not-yet-used expected value in this group, so filling
    // working steps in a different order than the JSON lists them still counts.
    const matchIdx = bestMatch(given, expected);

    rows.forEach((row, i) => {
      inputs[i].value = given[i];
      inputs[i].disabled = true;
      const isRight = matchIdx[i] !== -1;
      row.classList.add(isRight ? 'correct' : 'incorrect');
      if (isRight) earned++;
    });

    const usedExpected = new Set(matchIdx.filter(v => v !== -1));
    const missed = expected.filter((_, ei) => !usedExpected.has(ei));
    if (missed.length > 0) {
      const hint = document.createElement('div');
      hint.className = 'quiz-math-hint';
      hint.textContent = missed.length === 1
        ? `Missing: ${missed[0]}`
        : `Missing: ${missed.join(', ')}`;
      const groupEl = canvas.querySelector(`.quiz-math-group[data-group="${gi}"]`);
      if (groupEl) groupEl.appendChild(hint);
    }
  });

  return earned;
}

function submitMathAnswer() {
  if (quizState.perQuestion[quizState.index]) return; // already answered — ignore stray resubmits

  const q = quizState.questions[quizState.index];
  const canvas = document.getElementById('hscCanvas');

  const valuesFlat = new Array(q.answers.length).fill('');
  canvas.querySelectorAll('.quiz-math-input-row').forEach(row => {
    const itemIdx = parseInt(row.getAttribute('data-item'), 10);
    valuesFlat[itemIdx] = row.querySelector('.quiz-math-input').value;
  });

  const earned = applyMathGrading(canvas, q, valuesFlat);
  quizState.perQuestion[quizState.index] = { earned, total: q.answers.length, values: valuesFlat };
  persistCurrentQuiz();

  showFeedback(canvas, earned, q.answers.length);
  document.getElementById('quizSubmitBtn').style.display = 'none';
  revealAdvanceButton();
  renderSidebar(); // reflect the new correct/partial/incorrect color on this question's nav button
}

/* ── isAICheck: free-text response, marked by Gemini ──
   For questions where there's no single exact-match string worth checking
   against — "describe...", "explain...", "discuss..." — because the wording
   of a correct answer genuinely varies. q.answer holds the marking guidance
   (what a full-marks response should cover, not a literal string to match),
   q.marks is the total for the sub-part. Reuses the app's existing /api/grade
   Netlify function (same one analyser.html's marker already calls) so no
   API key ever reaches the browser — see netlify/functions/grade.js. */

// Same proxy-first-then-direct-fallback pattern as analyser.html's callAI(),
// trimmed to the one provider this page needs. The direct-call fallback only
// works if a userKey is supplied (there's no customApiKey box on this page),
// so in practice it just produces a clear "no proxy" error when /api/grade
// isn't reachable (e.g. testing without `netlify dev`) rather than a silent
// hang or a confusing generic network error.
async function callGeminiDirect(prompt, userKey) {
  if (!userKey) throw new Error('AI marking needs the live site (no local proxy available here).');
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${userKey}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
  });
  const data = await res.json();
  if (!res.ok) throw new Error((data.error && data.error.message) || 'Gemini request failed');
  return { text: data.candidates?.[0]?.content?.parts?.[0]?.text || '' };
}

async function callAI(provider, prompt, userKey) {
  try {
    const headers = { 'Content-Type': 'application/json' };
    // /api/grade requires a signed-in Firebase account so its server-side
    // keys can't be spent by anonymous callers — attach the current ID token.
    const currentUser = window.__sbAuth && window.__sbAuth.currentUser;
    if (currentUser) {
      headers['Authorization'] = 'Bearer ' + await currentUser.getIdToken();
    }
    const res = await fetch('/api/grade', {
      method: 'POST',
      headers,
      body: JSON.stringify({ provider, prompt, userKey })
    });
    // A missing proxy (e.g. a plain static file server, not `netlify dev`)
    // returns an HTML 404 page, not JSON — detect that and fall back.
    const contentType = res.headers.get('content-type') || '';
    if (res.status === 404 || res.status === 405 || !contentType.includes('application/json')) {
      throw new Error('PROXY_UNAVAILABLE');
    }
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return { text: data.text || '' };
  } catch (err) {
    if (err.message !== 'PROXY_UNAVAILABLE' && err.name !== 'TypeError') throw err;
    return callGeminiDirect(prompt, userKey);
  }
}

function buildAICheckPrompt(q, studentAnswer) {
  const markWord = q.marks === 1 ? 'mark' : 'marks';
  return `You are marking a NSW HSC-style short-answer question worth ${q.marks} ${markWord}.

QUESTION:
${q.question || q.name}

MARKING GUIDANCE (what a full-marks response should cover — this is guidance for the marker, not a literal string the student needs to reproduce):
${q.answer}

STUDENT'S RESPONSE:
${studentAnswer}

Award a whole number of marks from 0 to ${q.marks} based on how well the student's response covers the marking guidance. Be a fair but genuine HSC-style marker: full marks for a response that covers the key points even in different words, partial credit for a partially correct or incomplete response, 0 for a response that doesn't address the question.

Respond in exactly this format and nothing else outside these markers:
(359-<marks awarded, a single integer>-359)
(369-<one or two sentence feedback explaining what was missing or well covered, max 40 words>-369)`;
}

function parseAICheckResult(text, maxMarks) {
  let earned = 0;
  const markMatch = (text || '').match(/\(359-([\s\S]*?)-359\)/i);
  if (markMatch) {
    const num = parseInt(markMatch[1].trim(), 10);
    if (!isNaN(num)) earned = Math.max(0, Math.min(maxMarks, num));
  }
  const feedbackMatch = (text || '').match(/\(369-([\s\S]*?)-369\)/i);
  const feedback = feedbackMatch ? feedbackMatch[1].trim() : (text || '').trim().slice(0, 200);
  return { earned, feedback };
}

function setAICheckBusy(canvas, busy) {
  const btn = canvas.querySelector('#quizSubmitBtn');
  const textarea = canvas.querySelector('#quizAIAnswerInput');
  if (btn) { btn.disabled = busy; btn.textContent = busy ? 'Marking with AI…' : 'Submit'; }
  if (textarea) textarea.disabled = busy;
}

function renderAICheckQuestion(q, index, total, prior) {
  const canvas = document.getElementById('hscCanvas');
  const markWord = q.marks === 1 ? 'mark' : 'marks';

  paintQuiz(`
    <div class="quiz-wrap">
      <div class="quiz-progress">Question ${index + 1} of ${total} of "${escapeHtml(quizState.quizName || '')}"</div>
      <div class="quiz-heading">
        <span class="quiz-heading-name"></span>
        <span class="quiz-heading-marks">(${q.marks} ${markWord})</span>
      </div>
      <div class="quiz-stem"></div>
      <div class="quiz-image-wrap" id="quizImageWrap"></div>
      <div class="quiz-type-hint">✎ Written response — marked by AI</div>
      <textarea class="quiz-ai-answer" id="quizAIAnswerInput" placeholder="Type your answer…" rows="6"></textarea>
      <div class="quiz-feedback" id="quizFeedback"></div>
      <div class="quiz-actions">
        <button class="quiz-btn quiz-btn-primary" id="quizSubmitBtn" onclick="submitAICheck()">Submit</button>
        <button class="quiz-btn" id="quizNextBtn" style="display:none" onclick="nextQuestion()">Next →</button>
      </div>
    </div>
  `, q);

  renderHeadingAndStem(canvas, q);
  renderQuestionImage(q, canvas);

  if (prior) {
    const textarea = canvas.querySelector('#quizAIAnswerInput');
    textarea.value = prior.studentAnswer;
    textarea.disabled = true;
    showFeedback(canvas, prior.earned, q.marks, prior.feedback);
    document.getElementById('quizSubmitBtn').style.display = 'none';
    revealAdvanceButton();
  }
}

async function submitAICheck() {
  if (quizState.perQuestion[quizState.index]) return; // already answered — ignore stray resubmits

  const q = quizState.questions[quizState.index];
  const canvas = document.getElementById('hscCanvas');
  const textarea = canvas.querySelector('#quizAIAnswerInput');
  const studentAnswer = (textarea.value || '').trim();
  if (!studentAnswer) return;

  const feedbackEl = canvas.querySelector('#quizFeedback');

  // True guests (no real Firebase sign-in at all) have no ID token, so
  // /api/grade would just 401. Pending / unapproved accounts now get 403
  // from the server as well (status must be 'active'). Short-circuit here
  // with the same message analyser.html shows instead of a network error.
  const currentUser = window.__sbAuth && window.__sbAuth.currentUser;
  if (!currentUser || window.isGuest) {
    feedbackEl.textContent = 'Sign in with an approved account to use AI marking.';
    feedbackEl.className = 'quiz-feedback quiz-incorrect';
    return;
  }

  setAICheckBusy(canvas, true);
  feedbackEl.textContent = 'Marking with AI…';
  feedbackEl.className = 'quiz-feedback';

  try {
    const prompt = buildAICheckPrompt(q, studentAnswer);
    const result = await callAI('gemini', prompt);
    const { earned, feedback } = parseAICheckResult(result.text, q.marks);

    quizState.perQuestion[quizState.index] = { earned, total: q.marks, studentAnswer, feedback };
    persistCurrentQuiz();

    // Reset the submit button's busy label directly rather than via
    // setAICheckBusy(canvas, false) — that helper also flips textarea.disabled
    // back to false, which would silently re-enable editing on an already-
    // graded answer.
    const submitBtn = canvas.querySelector('#quizSubmitBtn');
    if (submitBtn) submitBtn.textContent = 'Submit';
    textarea.disabled = true;
    showFeedback(canvas, earned, q.marks, feedback);
    document.getElementById('quizSubmitBtn').style.display = 'none';
    revealAdvanceButton();
    renderSidebar();
  } catch (err) {
    setAICheckBusy(canvas, false);
    feedbackEl.textContent = `AI marking failed: ${err.message}`;
    feedbackEl.className = 'quiz-feedback quiz-incorrect';
  }
}

/* ── Shared ── */

function revealAdvanceButton() {
  const btn = document.getElementById('quizNextBtn');
  if (!btn) return;
  const last = quizState.index + 1 >= quizState.questions.length;
  btn.textContent = last ? 'Submit' : 'Next →';
  btn.style.display = 'inline-block';
}

function nextQuestion() {
  if (quizState.index + 1 >= quizState.questions.length) {
    renderSummary();
    return;
  }
  quizState.index++;
  persistCurrentQuiz();
  renderQuestion();
}

function questionOutcomes() {
  let correct = 0, incorrect = 0, partial = 0, unanswered = 0;
  quizState.perQuestion.forEach(p => {
    if (!p) { unanswered++; return; }
    if (p.earned === p.total) correct++;
    else if (p.earned === 0) incorrect++;
    else partial++;
  });
  return { correct, incorrect, partial, unanswered };
}

function nextSectionEntry() {
  const current = quizManifest.find(m => m.file === quizState.filename);
  if (!current) return null;
  const siblings = quizManifest.filter(m => m.subject === current.subject && m.name === current.name);
  const i = siblings.findIndex(m => m.file === quizState.filename);
  if (i < 0 || i + 1 >= siblings.length) return null;
  return siblings[i + 1];
}

async function continueToNextSection() {
  const next = nextSectionEntry();
  if (next) {
    await loadQuizByFile(next.file, next.name);
    persistCurrentQuiz();
  } else {
    showQuizHome();
  }
}

function renderSummary() {
  quizState.atSummary = true;
  persistCurrentQuiz();
  const canvas = document.getElementById('hscCanvas');
  const earnedMarks = getEarnedMarks();
  const { totalMarks, quizName } = quizState;
  const { correct, incorrect, partial, unanswered } = questionOutcomes();
  const next = nextSectionEntry();
  const extra = [
    partial ? `${partial} partial` : '',
    unanswered ? `${unanswered} unanswered` : ''
  ].filter(Boolean).join(' · ');
  const nextLabel = next
    ? `Continue to ${next.section || next.name}`
    : 'Back to quizzes';

  canvas.innerHTML = `
    <div class="quiz-wrap quiz-summary">
      <div class="quiz-progress">${escapeHtml(quizName || 'Section')} complete</div>
      <div class="quiz-score">${earnedMarks} / ${totalMarks} marks</div>
      <p class="quiz-ratio">Correct to incorrect <strong>${correct} : ${incorrect}</strong></p>
      ${extra ? `<p class="quiz-summary-sub">${escapeHtml(extra)}</p>` : '<div class="quiz-summary-sub"></div>'}
      <div class="quiz-home-actions">
        <button type="button" class="quiz-btn" id="quizSummaryHome">All quizzes</button>
        <button type="button" class="quiz-btn quiz-btn-primary" id="quizSummaryNext">${escapeHtml(nextLabel)}</button>
      </div>
    </div>
  `;
  canvas.querySelector('#quizSummaryHome').addEventListener('click', showQuizHome);
  canvas.querySelector('#quizSummaryNext').addEventListener('click', continueToNextSection);
}

document.addEventListener('DOMContentLoaded', bootHsc);
window.addEventListener('beforeunload', () => {
  if (currentQuizHasProgress()) persistCurrentQuiz();
});
window.addEventListener('hashchange', () => {
  if (!quizManifest.length) return;
  const hashFile = quizHashFile();
  if (!hashFile) {
    if (quizState) showQuizHome();
    return;
  }
  const entry = quizManifest.find(m => m.file === hashFile);
  if (entry && (!quizState || quizState.filename !== hashFile)) {
    loadQuizByFile(entry.file, entry.name, { resume: true });
  }
});
</script>
