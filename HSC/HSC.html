<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSC — StudyBase</title>
<!-- Favicon -->
<link rel="icon" href="../icon.png" type="image/png">
<link rel="apple-touch-icon" href="../icon.png">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../mainstyle.css">
<style>
  /* Quiz UI — uses the app's existing CSS variables, with fallbacks in case any aren't set */
  .quiz-status {
    padding: 24px;
    font-family: 'Inter', sans-serif;
    color: var(--muted, #666);
  }
  .quiz-status.quiz-error { color: #c0392b; }

  /* The sidebar (question picker + nav list) reuses the app's real .sidebar/.detail-panel
     shell and .search-input/.unit-*/.topic-item component classes from mainstyle.css —
     see the <nav class="sidebar"> markup below — rather than inventing new ones, so this
     page matches subject.html instead of looking like a bolted-on quiz widget.

     The only genuinely new pieces are the per-question mark-delta badges, styled after
     the ▲/▼ score-change indicators on the analyser page (.strip-delta there). Colors are
     copied from analyser.html's palette; "partial" is a same-family addition it doesn't
     have (that page only shows full deltas, never partial-credit ones). */
  .quiz-nav-delta { font-size: 10px; font-weight: 700; white-space: nowrap; }
  .quiz-nav-delta.up { color: #15803d; }
  .quiz-nav-delta.down { color: #dc2626; }
  .quiz-nav-delta.partial { color: #b45309; }
  body.dark .quiz-nav-delta.up { color: #4ade80; }
  body.dark .quiz-nav-delta.down { color: #f87171; }
  body.dark .quiz-nav-delta.partial { color: #fbbf24; }

  .quiz-wrap {
    max-width: 640px;
    margin: 0 auto;
    font-family: 'Inter', sans-serif;
  }
  @media (min-width: 701px) {
    /* Above the 700px mobile breakpoint (mainstyle.css's own sidebar breakpoint), .sidebar
       (268px + 1px border) sits in-flow to the left of .detail-panel, so centering
       .quiz-wrap within .detail-panel's own content box lands it ~134px right of the true
       screen center — the "centered in the white space, not the screen" issue. Shift left
       by half the sidebar's width to compensate, clamped at 0 so it can never run into the
       sidebar itself on narrower desktop windows. */
    .quiz-wrap {
      margin-left: max(0px, calc((100% - 640px) / 2 - 134.5px));
      margin-right: 0;
    }
  }
  .quiz-progress {
    font-size: 12px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--muted2, #999);
    margin-bottom: 10px;
  }
  /* Exam-style heading: "Question 11" left, "(3 marks)" right, thin rule underneath —
     mirrors the look of the printed HSC paper. */
  .quiz-heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    font-family: 'Source Serif 4', serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--text, #1a1a1a);
    padding-bottom: 8px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--border, #e0e0e0);
  }
  .quiz-heading-marks {
    font-weight: 400;
    font-size: 13px;
    color: var(--muted2, #999);
    white-space: nowrap;
  }
  /* Question stem — the actual wording, styled like exam-paper body text rather
     than a UI label. Falls back to holding the full question text on older quiz
     files that don't have a separate `question` field. */
  .quiz-stem {
    font-family: 'Source Serif 4', serif;
    font-size: 16px;
    font-weight: 400;
    color: var(--text, #1a1a1a);
    line-height: 1.6;
    margin-bottom: 16px;
  }
  .quiz-type-hint {
    font-size: 12px;
    color: var(--muted2, #999);
    margin-bottom: 14px;
  }
  .quiz-image-wrap:empty { display: none; }
  .quiz-image-wrap { margin-bottom: 16px; background: var(--card, #fff); border-radius: 8px; }
  .quiz-image {
    display: block;
    max-width: 100%;
    height: auto;
    border-radius: 8px;
    border: 1px solid var(--border, #e0e0e0);
    background: transparent;
  }
  /* This page reuses mainstyle.css's subject-page dark-mode img filter
     (auto-inverts images so light diagrams don't glow), which is why
     question images get inverted here too. Same escape hatch as the topic
     PDF/Image viewer: click toggles .no-invert. */
  body.dark .quiz-image { cursor: pointer; transition: filter .12s; }

  /* Multiple choice / checkbox answers */
  .quiz-answers {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
  }
  .quiz-answer {
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    padding: 12px 14px;
    border: 1px solid var(--border, #e0e0e0);
    border-radius: 8px;
    background: var(--card, #fff);
    color: var(--text, #1a1a1a);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .quiz-answer:hover:not(.locked) { border-color: var(--accent, #4f46e5); }
  .quiz-answer.selected { border-color: var(--accent, #4f46e5); background: color-mix(in srgb, var(--accent, #4f46e5) 10%, transparent); }
  .quiz-answer.locked { cursor: default; }
  .quiz-answer.correct { border-color: #2e7d32; background: rgba(46,125,50,0.12); }
  .quiz-answer.incorrect { border-color: #c0392b; background: rgba(192,57,43,0.10); }
  .quiz-answer input[type="radio"],
  .quiz-answer input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--accent, #4f46e5);
    flex-shrink: 0;
    cursor: pointer;
  }
  .quiz-answer.locked input { cursor: default; }

  /* Math / fill-in-the-blank answers */
  .quiz-math-answers {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }
  /* One group per run of consecutive same-type entries (e.g. all "working" rows
     together, the final "answer" row on its own). Styled as ruled writing lines
     rather than boxed UI cards, closer to the blank answer space on the printed
     exam paper. */
  .quiz-math-group {
    padding: 4px 0 10px;
  }
  .quiz-math-group-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--muted2, #999);
    margin-bottom: 8px;
  }
  .quiz-math-input-rows {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .quiz-math-input-row { display: flex; align-items: center; gap: 10px; }
  .quiz-math-input {
    flex: 1;
    border: none;
    border-bottom: 1px dotted var(--muted2, #999);
    border-radius: 0;
    padding: 6px 2px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    background: transparent;
    color: var(--text, #1a1a1a);
  }
  .quiz-math-input:focus { outline: none; border-bottom-style: solid; border-bottom-color: var(--accent, #4f46e5); }
  .quiz-math-input:disabled { opacity: .85; }
  .quiz-math-input-row.correct .quiz-math-input { border-bottom-color: #2e7d32; border-bottom-style: solid; }
  .quiz-math-input-row.incorrect .quiz-math-input { border-bottom-color: #c0392b; border-bottom-style: solid; }
  /* Working rows: same grading behavior as an answer row, styled as a lighter, secondary step */
  .quiz-math-group.quiz-math-working .quiz-math-input {
    font-style: italic;
  }
  .quiz-math-mark-label {
    font-size: 11px;
    color: var(--muted2, #999);
    white-space: nowrap;
  }
  .quiz-math-hint {
    font-size: 12px;
    color: #c0392b;
    margin-top: 4px;
  }

  /* isAICheck: free-text response for questions with no single exact-match
     answer ("describe...", "explain...", "discuss..."). Boxed like a real
     textbox rather than the underlined math input, since a full paragraph
     doesn't read well as a single ruled line. */
  .quiz-ai-answer {
    width: 100%;
    box-sizing: border-box;
    min-height: 140px;
    padding: 12px 14px;
    border: 1px solid var(--border, #e0e0e0);
    border-radius: 8px;
    background: var(--card, #fff);
    color: var(--text, #1a1a1a);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    resize: vertical;
    margin-bottom: 16px;
  }
  .quiz-ai-answer:focus { outline: none; border-color: var(--accent, #4f46e5); }
  .quiz-ai-answer:disabled { opacity: .85; resize: none; }

  .quiz-feedback { font-size: 14px; font-weight: 600; min-height: 20px; margin-bottom: 12px; }
  .quiz-feedback.quiz-correct { color: #2e7d32; }
  .quiz-feedback.quiz-partial { color: #b8860b; }
  .quiz-feedback.quiz-incorrect { color: #c0392b; }

  .quiz-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .quiz-btn {
    padding: 9px 18px;
    border-radius: 7px;
    border: 1px solid var(--border, #e0e0e0);
    background: var(--card, #fff);
    color: var(--text, #1a1a1a);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .quiz-btn-primary { background: var(--accent, #4f46e5); color: #fff; border-color: transparent; }
  .quiz-btn:disabled { opacity: .5; cursor: default; }

  .quiz-summary { text-align: center; }
  .quiz-score {
    font-family: 'Source Serif 4', serif;
    font-size: 32px;
    font-weight: 700;
    color: var(--text, #1a1a1a);
    margin: 12px 0 8px;
  }
  .quiz-ratio {
    font-size: 15px;
    color: var(--muted, #666);
    margin: 0 0 8px;
  }
  .quiz-ratio strong { color: var(--text, #1a1a1a); }
  .quiz-summary-sub {
    font-size: 12px;
    color: var(--muted2, #999);
    margin: 0 0 22px;
  }
  .quiz-home-actions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }

  /* Home: pick a quiz. Uses the full detail panel (not the 640px question column). */
  .quiz-home { max-width: 820px; }
  .quiz-home-kicker {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted2, #999);
    margin-bottom: 6px;
  }
  .quiz-home-title {
    font-family: 'Source Serif 4', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--text, #1a1a1a);
    margin: 0 0 8px;
  }
  .quiz-home-lead {
    font-size: 14px;
    color: var(--muted, #666);
    margin: 0 0 28px;
    line-height: 1.5;
  }
  .quiz-paper-card {
    background: var(--card, #fff);
    border: 1px solid var(--border, #e0e0e0);
    border-radius: 10px;
    padding: 4px 0 6px;
    margin-bottom: 20px;
    box-shadow: var(--shadow, none);
    overflow: hidden;
    scroll-margin-top: 16px;
  }
  .quiz-home-subject { scroll-margin-top: 16px; }
  .quiz-home-subject-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px 10px;
  }
  .quiz-home-subject-emoji { font-size: 20px; line-height: 1; }
  .quiz-home-subject-name {
    font-family: 'Source Serif 4', serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--text, #1a1a1a);
  }
  .quiz-home-subject-count {
    margin-left: auto;
    font-size: 11px;
    color: var(--muted2, #999);
  }
  .quiz-paper-block { scroll-margin-top: 16px; }
  .quiz-paper-block + .quiz-paper-block { border-top: 1px solid var(--border, #e0e0e0); }
  .quiz-paper-head {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    padding: 14px 18px;
    border: none;
    background: transparent;
    color: var(--text, #1a1a1a);
    font-family: inherit;
    cursor: pointer;
    transition: background .12s;
  }
  .quiz-paper-head:hover { background: var(--card2, #f6f6f6); }
  .quiz-paper-head.is-split {
    cursor: default;
  }
  .quiz-paper-head.is-split:hover { background: transparent; }
  .quiz-paper-name {
    font-family: 'Source Serif 4', serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--text, #1a1a1a);
    flex: 1;
    min-width: 0;
  }
  .quiz-paper-head .quiz-section-go { margin-left: auto; flex-shrink: 0; }
  .quiz-paper-actions {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
    margin-left: auto;
  }
  .quiz-restart-btn,
  .quiz-continue-btn {
    padding: 0;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .quiz-restart-btn { color: var(--muted, #666); }
  .quiz-restart-btn:hover { color: var(--text, #1a1a1a); }
  .quiz-continue-btn { color: var(--accent, #4f46e5); }
  .quiz-paper-meta { display: none; }
  .quiz-section-row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    padding: 8px 18px 10px 18px;
    border: none;
    background: transparent;
    color: var(--text, #1a1a1a);
    font-family: 'Inter', sans-serif;
  }
  .quiz-section-name { font-size: 13px; font-weight: 400; color: var(--muted, #666); }
  .quiz-section-stats {
    margin-left: auto;
    font-size: 12px;
    color: var(--muted, #666);
    white-space: nowrap;
  }
  .quiz-section-go {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent, #4f46e5);
  }
  .quiz-home-empty { font-size: 14px; color: var(--muted, #666); padding: 12px 0; }
  .home-nav-subject .unit-label {
    padding: 12px 12px 4px;
    margin: 0;
    cursor: pointer;
  }
  .quiz-back-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 16px;
    border: none;
    border-bottom: 1px solid var(--border, #e0e0e0);
    background: transparent;
    color: var(--text, #1a1a1a);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .quiz-back-btn:hover { background: var(--card2, #f6f6f6); }
  .quiz-now-playing {
    padding: 8px 16px 10px;
    font-size: 12px;
    color: var(--muted, #666);
    border-bottom: 1px solid var(--border, #e0e0e0);
  }
  .quiz-now-playing strong { color: var(--text, #1a1a1a); display: block; font-size: 13px; font-weight: 600; }
  .quiz-now-sub { font-size: 11px; color: var(--muted2, #999); }
  #hdrBreadcrumb .bc-link { cursor: pointer; }

  /* Dictionary questions: question on the left, grouped formula list sticky
     on the right. Below 900px the sheet stacks above the question. */
  .quiz-stage.has-dictionary {
    display: flex;
    align-items: flex-start;
    gap: 24px;
    width: 100%;
  }
  .quiz-stage.has-dictionary .quiz-wrap {
    flex: 1;
    min-width: 0;
    max-width: 640px;
  }
  @media (min-width: 701px) {
    .quiz-stage.has-dictionary .quiz-wrap {
      margin-left: 0;
      margin-right: 0;
    }
  }
  .quiz-dictionary {
    width: min(46%, 440px);
    flex-shrink: 0;
    position: sticky;
    top: 12px;
    max-height: calc(100vh - 88px);
    overflow-y: auto;
    padding: 4px 4px 20px 12px;
    border-left: 1px solid var(--border, #e0e0e0);
  }
  .quiz-dictionary-title {
    font-family: 'Source Serif 4', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--text, #1a1a1a);
    margin: 0 0 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border, #e0e0e0);
  }
  .quiz-dictionary-section { margin-bottom: 20px; }
  .quiz-dictionary-section-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted2, #999);
    margin: 0 0 8px;
  }
  .quiz-dictionary-entries {
    display: flex;
    flex-wrap: wrap;
    column-gap: 24px;
    row-gap: 22px;
    align-items: baseline;
  }
  .quiz-dictionary-row {
    display: inline-flex;
    gap: 6px;
    align-items: baseline;
    white-space: nowrap;
    border: none;
    background: none;
    padding: 2px 5px;
    margin: -2px -5px;
    border-radius: 5px;
    cursor: pointer;
    font: inherit;
    color: inherit;
  }
  .quiz-dictionary-row:hover:not(:disabled) {
    background: color-mix(in srgb, var(--accent, #4f46e5) 10%, transparent);
  }
  .quiz-dictionary-row:focus-visible {
    outline: 2px solid var(--accent, #4f46e5);
    outline-offset: 1px;
  }
  .quiz-dictionary-row.is-picked {
    background: color-mix(in srgb, var(--accent, #4f46e5) 16%, transparent);
  }
  .quiz-dictionary-row:disabled {
    cursor: default;
    opacity: .75;
  }
  .quiz-dictionary-formula {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    color: var(--text, #1a1a1a);
    line-height: 1.45;
  }
  .quiz-dictionary-num {
    font-weight: 700;
    font-size: 13px;
    color: var(--accent, #4f46e5);
  }
  @media (max-width: 900px) {
    .quiz-stage.has-dictionary { flex-direction: column-reverse; }
    .quiz-dictionary {
      width: 100%;
      max-height: 42vh;
      position: static;
      border-left: none;
      border-bottom: 1px solid var(--border, #e0e0e0);
      padding: 0 0 14px;
    }
    .quiz-stage.has-dictionary .quiz-wrap { max-width: none; }
  }
</style>
</head>

<!-- Firebase auth -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { loadFirebaseConfig } from "../firebase-config.js";
  const auth = getAuth(initializeApp(await loadFirebaseConfig()));
  window.__sbAuth = auth; // so the quiz engine's callAI() can fetch a fresh ID token for /api/grade
  onAuthStateChanged(auth, user => {
    const isGuest = sessionStorage.getItem('studybase_guest') === '1';
    if (user) {
      sessionStorage.removeItem('studybase_guest');
      user.getIdTokenResult(true).then(result => {
        const role = result.claims.role || '';
        const status = result.claims.status || '';
        window.userRole = role;
        if (status !== 'active') {
          window.location.href = '../waiting.html';
          return;
        }
        if (typeof bootHdrProfile === 'function') bootHdrProfile(user, role);
      }).catch(() => {
        window.location.href = '../waiting.html';
      });
    } else if (isGuest) {
      window.isGuest = true;
      document.body.classList.add('guest-mode');
      document.getElementById('guest-border').style.display = 'block';
      document.getElementById('guest-nudge').style.display = 'block';
      if (typeof bootHdrProfile === 'function') bootHdrProfile(null, 'guest');
    } else {
      window.location.href = "../login.html";
    }
  });
  window.sbSignOut = () => {
    if (sessionStorage.getItem('studybase_guest') === '1') {
      sessionStorage.removeItem('studybase_guest');
      window.location.href = "../login.html";
      return;
    }
    signOut(auth).then(() => window.location.href = "../login.html");
  };
</script>

<!-- Header (same structure as subject.html, minus the Flashcards button) -->

        <div class="logo-icon2">🎓</div>

<!-- Quiz canvas: the app's real .sidebar (question picker + nav list) next to its real
     .detail-panel (current question) — same shell as subject.html, not a one-off layout. -->
<div class="app-body">
  <nav class="sidebar" id="quizSidebar"></nav>
  <div class="detail-panel" id="hscCanvas"></div>
</div>

<!-- Guest overlays -->
<div id="guest-border"></div>
<div id="guest-nudge">
