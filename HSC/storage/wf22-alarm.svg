<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="Alarm triggered by temperature or pressure sensor">
  <rect width="640" height="240" fill="#fff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>
  <rect x="30" y="36" width="170" height="64" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="115" y="74" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="15">temperature</text>
  <text x="115" y="92" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="15">sensor</text>
  <rect x="30" y="140" width="170" height="64" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="115" y="178" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="15">pressure</text>
  <text x="115" y="196" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="15">sensor</text>
  <rect x="300" y="72" width="140" height="96" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="370" y="126" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="18">alarm</text>
  <line x1="200" y1="68" x2="300" y2="98" stroke="#111" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="200" y1="172" x2="300" y2="142" stroke="#111" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="440" y1="120" x2="580" y2="120" stroke="#111" stroke-width="2" marker-end="url(#ah)"/>
  <text x="510" y="108" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="16">sound</text>
</svg>
