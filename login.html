<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyBase — Sign In</title>
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="mainstyle.css">
<script src="sync-config.js"></script>
</head>
<body class="auth-page">

<header>
  <div class="header-inner">
    <a class="wordmark" href="#">
      <div class="wordmark-icon">📚</div>
      <div><h1>StudyBase</h1><span>YOUR STUDY HUB</span></div>
    </a>
    <button class="dark-toggle" id="darkToggle" title="Toggle dark mode">🌙</button>
  </div>
</header>

<div class="page">
  <div class="login-card">

    <!-- Auth forms -->
    <div id="authForms">
      <div class="login-title" id="cardTitle">Welcome back</div>
      <div class="login-sub" id="cardSub">Sign in to access your study notes</div>

      <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="tabSignIn" onclick="switchTab('signin')">Sign In</button>
        <button type="button" class="auth-tab" id="tabSignUp" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <div class="error-msg" id="errorMsg"></div>
      <div class="success-msg" id="successMsg"></div>

      <!-- Sign In -->
      <div id="signInFields">
        <div class="form-group">
          <label>Email address</label>
          <input class="form-i" type="email" id="emailInput" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input class="form-i" type="password" id="passInput" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="btn-primary" id="mainBtn" onclick="handleSignIn()">Sign In</button>
      </div>

      <!-- Sign Up -->
      <div id="signUpFields" style="display:none">
        <div class="form-group">
          <label>Full name</label>
          <input class="form-i" type="text" id="nameInput" placeholder="Jane Smith" autocomplete="name">
        </div>
        <div class="form-group">
          <label>Email address</label>
          <input class="form-i" type="email" id="suEmailInput" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input class="form-i" type="password" id="suPassInput" placeholder="At least 6 characters" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label>I am a…</label>
          <!-- Dev option removed — devs add themselves manually -->
          <select class="form-sel" id="roleSelect">
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
          </select>
          <div class="form-hint">
            Every new account is reviewed by a dev before access is granted — you can still browse as a guest in the meantime.
          </div>
        </div>
        <button class="btn-primary" id="suBtn" onclick="handleSignUp()">Create account</button>
      </div>

      <div class="or-divider">or</div>
      <button class="btn-ghost" onclick="enterGuest()">Continue as Guest</button>
    </div>

  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAZeyBIaTstTJ5Pr9o86MHk8dhDPAJFFCA",
    authDomain: "studybase-8cfa1.firebaseapp.com",
    projectId: "studybase-8cfa1",
    storageBucket: "studybase-8cfa1.firebasestorage.app",
    messagingSenderId: "434992387793",
    appId: "1:434992387793:web:e5bcae8cad63b4eb6f17f0"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Prevents the auth-state listener auto-redirecting during sign-up flow
  // or when we've already determined the user is pending/rejected.
  let suppressAutoRedirect = false;

  onAuthStateChanged(auth, async (user) => {
    if (!user || suppressAutoRedirect) return;

    // Force-refresh so we always have the latest claims (e.g. after admin approval).
    // Missing/empty status is treated as pending — a signup whose registerRole
    // call failed must not land on the hub with full access.
    let status = '';
    try {
      const token = await user.getIdTokenResult(true);
      status = token.claims.status || '';
    } catch (e) {
      status = '';
    }

    if (status !== 'active') {
      suppressAutoRedirect = true;
      window.location.href = 'waiting.html';
      return;
    }

    // Everyone else (active student, teacher, dev) goes straight in
    sessionStorage.removeItem('studybase_guest');
    window.location.href = 'index.html';
  });

  // ── Dark mode ──
  function applyDark() {
    const on = localStorage.getItem('studybase_dark') === '1';
    document.body.classList.toggle('dark', on);
    document.getElementById('darkToggle').textContent = on ? '☀️' : '🌙';
  }
  applyDark();
  document.getElementById('darkToggle').addEventListener('click', () => {
    const on = document.body.classList.toggle('dark');
    localStorage.setItem('studybase_dark', on ? '1' : '0');
    document.getElementById('darkToggle').textContent = on ? '☀️' : '🌙';
  });

  // ── Tabs ──
  window.switchTab = function(tab) {
    const su = tab === 'signup';
    document.getElementById('tabSignIn').classList.toggle('active', !su);
    document.getElementById('tabSignUp').classList.toggle('active', su);
    document.getElementById('signInFields').style.display = su ? 'none' : 'block';
    document.getElementById('signUpFields').style.display = su ? 'block' : 'none';
    document.getElementById('cardTitle').textContent = su ? 'Create your account' : 'Welcome back';
    document.getElementById('cardSub').textContent   = su ? 'Sign up to start adding and tracking your notes' : 'Sign in to access your study notes';
    hideMessages();
  };

  function hideMessages() {
    document.getElementById('errorMsg').classList.remove('show');
    document.getElementById('successMsg').classList.remove('show');
  }
  function showError(msg) {
    hideMessages();
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.add('show');
  }
  function friendlyError(code) {
    return ({
      'auth/invalid-email':        'That email address looks invalid.',
      'auth/user-not-found':       'No account found with that email.',
      'auth/wrong-password':       'Incorrect password — try again.',
      'auth/too-many-requests':    'Too many attempts. Try again later.',
      'auth/invalid-credential':   'Email or password is incorrect.',
      'auth/email-already-in-use': 'An account with that email already exists.',
      'auth/weak-password':        'Password must be at least 6 characters.',
    })[code] || 'Something went wrong. Please try again.';
  }

  // ── Sign In ──
  window.handleSignIn = async function() {
    hideMessages();
    const email = document.getElementById('emailInput').value.trim();
    const pass  = document.getElementById('passInput').value;
    if (!email || !pass) { showError('Please fill in both fields.'); return; }
    const btn = document.getElementById('mainBtn');
    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      await signInWithEmailAndPassword(auth, email, pass);
      // onAuthStateChanged handles the rest (pending/rejected check + redirect)
    } catch (e) {
      showError(friendlyError(e.code));
      btn.disabled = false; btn.textContent = 'Sign In';
    }
  };

  // ── Sign Up ──
  window.handleSignUp = async function() {
    hideMessages();
    const name          = document.getElementById('nameInput').value.trim();
    const email         = document.getElementById('suEmailInput').value.trim();
    const pass          = document.getElementById('suPassInput').value;
    const requestedRole = document.getElementById('roleSelect').value;

    if (!name || !email || !pass) { showError('Please fill in all fields.'); return; }
    if (pass.length < 6)          { showError('Password must be at least 6 characters.'); return; }

    // Belt-and-braces: dev role is not in the dropdown but block it server-side too
    if (requestedRole === 'dev') { showError('Dev accounts must be created manually.'); return; }

    const btn = document.getElementById('suBtn');
    btn.disabled = true; btn.textContent = 'Creating account…';

    // Set this BEFORE creating the account. Firebase's auth-state listener
    // can fire the moment the account exists internally — which can happen
    // before createUserWithEmailAndPassword's own promise even resolves back
    // to this function — and a brand-new user has no custom claims yet, so
    // the listener would otherwise treat them as a normal active user and
    // send them straight to index.html. Setting the flag first closes that
    // race entirely; handleSignUp (below) owns the post-signup redirect.
    suppressAutoRedirect = true;

    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: name });

      // Ask the server to set the role claim. Needs the new user's own ID
      // token so registerRole.js can verify the caller and match uid —
      // without this the call 401s and silently falls back to 'pending'
      // below anyway, but the claims never actually get set server-side.
      let result = { status: 'pending', requestedRole };
      try {
        const idToken = await cred.user.getIdToken();
        const res = await fetch((typeof sbApiUrl === 'function' ? sbApiUrl('/api/registerRole') : '/api/registerRole'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + idToken },
          body: JSON.stringify({ uid: cred.user.uid, email, requestedRole }),
        });
        if (res.ok) result = await res.json();
      } catch (netErr) {
        console.error('registerRole call failed:', netErr);
        // Safer to treat as pending if we can't reach the server
      }

      // Wait briefly for Firebase to propagate the custom claims,
      // then force-refresh the token so the new claims are live
      await new Promise(r => setTimeout(r, 1500));
      await cred.user.getIdToken(true);

      if (result.status === 'active') {
        // Defensive fallback — every sign-up is pending by default now,
        // but go straight in if a claim ever comes back active.
        window.location.href = 'index.html';
        return;
      }

      // Every new account starts pending — send them to the waiting page
      // until a dev approves (or denies) the request.
      window.location.href = 'waiting.html';

    } catch (e) {
      // Account creation (or the flow after it) failed — no auth-state change
      // actually happened for a failed createUserWithEmailAndPassword, so
      // re-enable the listener; otherwise a failed sign-up would silently
      // disable auto-redirect for the rest of this page load (e.g. if the
      // user then switches to Sign In).
      suppressAutoRedirect = false;
      showError(friendlyError(e.code));
      btn.disabled = false; btn.textContent = 'Create account';
    }
  };

  window.enterGuest = function() {
    sessionStorage.setItem('studybase_guest', '1');
    window.location.href = 'index.html';
  };

  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const su = document.getElementById('signUpFields').style.display !== 'none';
    if (su) handleSignUp(); else handleSignIn();
  });
</script>
</body>
</html>
