<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="Vehicle accelerating along a level road">
  <rect width="640" height="280" fill="#fff"/>
  <defs>
    <pattern id="gnd" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M-1,9 L9,-1" stroke="#222" stroke-width="0.8"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>
  <rect x="40" y="210" width="560" height="18" fill="url(#gnd)" stroke="#111" stroke-width="1.5"/>
  <line x1="40" y1="210" x2="600" y2="210" stroke="#111" stroke-width="2"/>
  <rect x="150" y="128" width="280" height="62" rx="10" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="248" y="104" width="122" height="28" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <circle cx="210" cy="198" r="22" fill="#fff" stroke="#111" stroke-width="2"/>
  <circle cx="210" cy="198" r="8" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <circle cx="368" cy="198" r="22" fill="#fff" stroke="#111" stroke-width="2"/>
  <circle cx="368" cy="198" r="8" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="290" y="166" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="18">m = 1400 kg</text>
  <line x1="450" y1="148" x2="580" y2="148" stroke="#111" stroke-width="2" marker-end="url(#ah)"/>
  <text x="515" y="136" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="18" font-style="italic">a</text>
  <text x="515" y="176" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="16">2.2 m/s^2</text>
</svg>
