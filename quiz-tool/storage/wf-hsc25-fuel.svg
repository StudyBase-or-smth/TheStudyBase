<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" role="img" aria-label="Aircraft fuel tank with a column of fuel">
  <rect width="420" height="340" fill="#fff"/>
  <rect x="90" y="50" width="160" height="240" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <rect x="90" y="150" width="160" height="140" fill="#e8e8e8" stroke="#111" stroke-width="1.5"/>
  <line x1="90" y1="150" x2="250" y2="150" stroke="#111" stroke-width="1.5"/>
  <text x="170" y="38" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="15">P0 = 20 kPa</text>
  <text x="170" y="230" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="15">fuel</text>
  <text x="170" y="250" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="14">800 kg/m^3</text>
  <line x1="280" y1="150" x2="280" y2="290" stroke="#111" stroke-width="1.3"/>
  <line x1="274" y1="150" x2="286" y2="150" stroke="#111" stroke-width="1.3"/>
  <line x1="274" y1="290" x2="286" y2="290" stroke="#111" stroke-width="1.3"/>
  <text x="296" y="226" font-family="Times New Roman, Times, serif" font-size="15">1.5 m</text>
</svg>
