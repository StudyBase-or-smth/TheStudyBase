<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-label="Simple machine showing distances moved by effort and load">
  <rect width="620" height="300" fill="#fff"/>
  <defs>
    <pattern id="gnd" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M-1,9 L9,-1" stroke="#222" stroke-width="0.8"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>
  <polygon points="300,188 328,230 272,230" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="286" y="230" width="28" height="12" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <rect x="250" y="242" width="100" height="16" fill="url(#gnd)" stroke="#111" stroke-width="1.2"/>
  <line x1="80" y1="120" x2="540" y2="196" stroke="#111" stroke-width="6" stroke-linecap="round"/>
  <line x1="80" y1="120" x2="80" y2="196" stroke="#111" stroke-width="2" marker-end="url(#ah)"/>
  <text x="96" y="168" font-family="Times New Roman, Times, serif" font-size="16" font-style="italic">d</text>
  <text x="106" y="172" font-family="Times New Roman, Times, serif" font-size="11">E</text>
  <text x="96" y="188" font-family="Times New Roman, Times, serif" font-size="14">effort</text>
  <line x1="540" y1="196" x2="540" y2="248" stroke="#111" stroke-width="2" marker-end="url(#ah)"/>
  <text x="552" y="228" font-family="Times New Roman, Times, serif" font-size="16" font-style="italic">d</text>
  <text x="562" y="232" font-family="Times New Roman, Times, serif" font-size="11">L</text>
  <rect x="518" y="248" width="44" height="28" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="540" y="296" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="14">load</text>
</svg>
