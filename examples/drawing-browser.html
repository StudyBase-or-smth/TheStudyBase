<!doctype html><html><head><meta charset="utf-8"><title>Draw browser regression check</title><link rel="stylesheet" href="../mainstyle.css"><link rel="stylesheet" href="../qol.css"><link rel="stylesheet" href="../subject/drawing.css"><style>body{padding:20px}#editor{max-width:900px}pre{white-space:pre-wrap}</style></head><body><h1>Draw browser regression check</h1><button id="sample">Load sample image</button><div id="editor"></div><pre id="result">Ready</pre><script src="../vendor/perfect-freehand/perfect-freehand.js"></script><script src="../drawing-core.js"></script><script src="../subject/drawing-import.js"></script><script src="../subject/drawing.js"></script><script>
let app;const result=document.getElementById('result');window.addEventListener('error',event=>result.textContent='ERROR: '+event.message);window.addEventListener('unhandledrejection',event=>result.textContent='ERROR: '+event.reason);
app=StudyDrawing.create(document.getElementById('editor'),{onChange(data){result.textContent='Strokes: '+data.strokes.length+' · '+data.width+' × '+data.height;}});
document.getElementById('sample').onclick=async()=>{const image=document.createElement('canvas');image.width=1200;image.height=900;const ctx=image.getContext('2d');ctx.fillStyle='#eee';ctx.fillRect(0,0,1200,900);ctx.fillStyle='#3584bb';ctx.fillRect(100,100,1000,700);ctx.fillStyle='#fff';ctx.font='60px sans-serif';ctx.fillText('Draw over this image',250,450);const blob=await new Promise(resolve=>image.toBlob(resolve,'image/png')),file=new File([blob],'test-image.png',{type:'image/png'}),transfer=new DataTransfer();transfer.items.add(file);const input=document.querySelector('input[type=file]');input.files=transfer.files;input.dispatchEvent(new Event('change',{bubbles:true}));};
</script></body></html>
