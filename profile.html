<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — StudyBase</title>
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;font-family:'Inter',sans-serif;font-size:14px}
body{background:#f5f2ed;color:#1c1917;display:flex;flex-direction:column}
:root{
  --card:#fff;--card2:#faf8f5;--border:#e2ddd7;--border2:#d4cec7;
  --text:#1c1917;--muted:#6c7778;--muted2:#8199a4;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --accent:#f59e0b;
}
.hdr-outer{background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:stretch;flex-shrink:0}
.accent-bar{width:6px;flex-shrink:0;background:var(--accent)}
.hdr-main{flex:1;display:flex;flex-direction:column;min-width:0}
.hdr-top{display:flex;align-items:center;padding:0 20px;height:44px;gap:10px}
.logo-block{display:flex;align-items:center;gap:9px;padding-right:14px;border-right:1px solid var(--border);flex-shrink:0}
.logo-icon2{width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.logo-text2{font-size:13px;font-weight:700;color:var(--text);font-family:'Lora',serif;letter-spacing:-.2px}
.logo-sub-txt{font-size:9px;color:var(--muted2);letter-spacing:.5px;display:block;line-height:1;margin-top:1px}
.hdr-breadcrumb{display:flex;align-items:center;gap:6px}
.bc-link{font-size:12px;color:var(--muted2);cursor:pointer;transition:color .12s;text-decoration:none}
.bc-link:hover{color:var(--muted)}
.bc-sep{font-size:11px;color:var(--muted2)}
.bc-current{font-size:12px;font-weight:600;color:var(--text)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.hdr-ghost{background:none;border:1px solid var(--border);border-radius:5px;padding:4px 7px;font-size:12px;color:var(--text);cursor:pointer;transition:all .12s;line-height:1;display:flex;align-items:center;justify-content:center;font-family:inherit}
.hdr-ghost:hover{background:var(--card2);border-color:var(--muted2)}
.page{flex:1;padding:32px 24px 60px;max-width:800px;margin:0 auto;width:100%}
.profile-hero{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:28px 32px;box-shadow:var(--shadow);display:flex;align-items:center;gap:24px;margin-bottom:20px}
.profile-avatar{width:72px;height:72px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:'Lora',serif;font-size:28px;font-weight:700;color:#fff;flex-shrink:0;letter-spacing:-1px}
.profile-name{font-family:'Lora',serif;font-size:24px;font-weight:700;color:var(--text);margin-bottom:4px}
.profile-email{font-size:13px;color:var(--muted);margin-bottom:4px}
.profile-since{font-size:11px;color:var(--muted2);margin-bottom:8px}
.profile-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
/* Role badges */
.profile-badge{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;border:1px solid}
.badge-student{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}
.badge-teacher{background:#fef9c3;border-color:#fde68a;color:#92400e}
.badge-dev{background:#f3e8ff;border-color:#d8b4fe;color:#6b21a8}
.badge-pending{background:#fff7ed;border-color:#fed7aa;color:#c2410c}
.badge-guest{background:var(--card2);border-color:var(--border);color:var(--muted)}
body.dark .badge-student{background:#1e3a5f!important;border-color:#2563eb!important;color:#93c5fd!important}
body.dark .badge-teacher{background:#1c1a08!important;border-color:#3d3410!important;color:#fde68a!important}
body.dark .badge-dev{background:#2e1a47!important;border-color:#7c3aed!important;color:#c4b5fd!important}
body.dark .badge-pending{background:#1f1208!important;border-color:#c2410c!important;color:#fdba74!important}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.profile-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px 24px;box-shadow:var(--shadow)}
.profile-card-title{font-family:'Lora',serif;font-size:14px;font-weight:600;color:var(--text);margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.stat-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.stat-row:last-child{border-bottom:none}
.stat-label{font-size:13px;color:var(--muted)}
.stat-val{font-size:15px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.fc-breakdown{display:flex;flex-direction:column;gap:10px}
.fc-bar-row{display:flex;flex-direction:column;gap:4px}
.fc-bar-label{display:flex;justify-content:space-between;font-size:12px}
.fc-bar-label span:first-child{color:var(--muted)}
.fc-bar-label span:last-child{font-weight:600;color:var(--text)}
.fc-bar-track{height:7px;background:var(--card2);border-radius:4px;overflow:hidden;border:1px solid var(--border)}
.fc-bar-fill{height:100%;border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.fc-bar-fill.correct{background:#22c55e}
.fc-bar-fill.close{background:#f59e0b}
.fc-bar-fill.incorrect{background:#ef4444}
.subj-links{display:flex;flex-direction:column;gap:6px}
.subj-link-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card2);text-decoration:none;transition:all .12s;cursor:pointer}
.subj-link-item:hover{border-color:var(--border2);background:var(--card);transform:translateX(3px)}
.subj-link-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.subj-link-name{font-size:13px;font-weight:500;color:var(--text);flex:1}
.subj-link-count{font-size:11px;color:var(--muted2)}
.profile-hero-text{flex:1;min-width:0}
.profile-avatar{overflow:hidden;position:relative}
.profile-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.profile-hero-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.profile-edit-btn{background:none;border:1px solid var(--border);border-radius:7px;padding:6px 12px;font-family:inherit;font-size:12px;font-weight:600;color:var(--text);cursor:pointer}
.profile-edit-btn:hover{background:var(--card2);border-color:var(--border2)}
.profile-edit-btn:disabled{opacity:.45;cursor:not-allowed}
.avatar-edit{position:relative;flex-shrink:0}
.avatar-change{position:absolute;left:0;right:0;bottom:0;border:none;background:rgba(0,0,0,.55);color:#fff;font-size:10px;font-weight:600;padding:5px 0;cursor:pointer;font-family:inherit}
.avatar-change:disabled{opacity:.6;cursor:wait}
.check-list{display:flex;flex-direction:column;gap:6px}
.check-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card2);cursor:pointer}
.check-row input{accent-color:var(--accent)}
.check-row .subj-link-name{flex:1}
.check-row-id{font-size:11px;color:var(--muted2);font-variant-numeric:tabular-nums;white-space:nowrap}
.check-hint{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.45}
.check-search{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-family:inherit;font-size:13px;color:var(--text);outline:none;margin-bottom:10px}
.check-search:focus{border-color:var(--border2);background:var(--card)}
.check-empty{display:none;font-size:12px;color:var(--muted2);padding:8px 2px}
.profile-signout{display:inline-block;margin:0;background:none;border:1px solid var(--border);border-radius:7px;padding:6px 12px;font-family:inherit;font-size:12px;font-weight:600;color:var(--text);cursor:pointer}
.profile-signout:hover{border-color:#ef4444;color:#ef4444}
.edit-actions{display:flex;gap:8px}
.btn-save-profile{background:var(--text);color:var(--card);border:none;border-radius:7px;padding:6px 12px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}
.btn-cancel-profile{background:none;border:1px solid var(--border);border-radius:7px;padding:6px 12px;font-family:inherit;font-size:12px;font-weight:600;color:var(--text);cursor:pointer}
body.dark{background:#141210;color:#e8e3dc;--card:#1e1c19;--card2:#252220;--border:#302d29;--border2:#3d3935;--text:#e8e3dc;--muted:#9e9890;--muted2:#6b6560;--shadow:0 1px 3px rgba(0,0,0,.3)}
body.dark .hdr-outer{background:var(--card)}
#sb-toast-c{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:9999;pointer-events:none}
.sb-toast{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--border2);border-radius:8px;padding:9px 13px;font-size:12px;color:var(--text);box-shadow:0 4px 16px rgba(0,0,0,.1);min-width:180px;animation:tb-in .2s ease;transition:opacity .3s,transform .3s}
.sb-toast.out{opacity:0;transform:translateX(16px)}
@keyframes tb-in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.so-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
.so-overlay.open{display:flex}
.so-modal{background:var(--card);border:1px solid var(--border);border-radius:12px;width:100%;max-width:360px;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.15);animation:sopop .18s cubic-bezier(.34,1.4,.64,1)}
@keyframes sopop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.so-modal h3{font-family:'Lora',serif;font-size:17px;font-weight:600;color:var(--text);margin-bottom:8px}
.so-modal p{font-size:13px;color:var(--muted);line-height:1.45;margin-bottom:18px}
.so-actions{display:flex;gap:8px;justify-content:flex-end}
.so-btn{padding:7px 14px;border-radius:7px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}
.so-btn.cancel{background:none;border:1px solid var(--border);color:var(--text)}
.so-btn.cancel:hover{background:var(--card2);border-color:var(--border2)}
.so-btn.confirm{background:#dc2626;border:none;color:#fff}
.so-btn.confirm:hover{opacity:.88}
@media(max-width:600px){.profile-grid{grid-template-columns:1fr}.profile-hero{flex-direction:column;text-align:center}}

/* ── Guest mode ── */
#guest-border{display:none;position:fixed;inset:0;pointer-events:none;z-index:9000;box-shadow:inset 0 0 0 3px #9ca3af;}
#guest-nudge{display:none;position:fixed;bottom:20px;right:20px;z-index:9001;background:var(--card);border:1px solid var(--border2);border-radius:10px;padding:14px 16px;width:210px;box-shadow:0 4px 20px rgba(0,0,0,.12);animation:nudge-in .25s cubic-bezier(.34,1.4,.64,1);}
@keyframes nudge-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
</head>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  const cfg = {
    apiKey:"AIzaSyAZeyBIaTstTJ5Pr9o86MHk8dhDPAJFFCA",
    authDomain:"studybase-8cfa1.firebaseapp.com",
    projectId:"studybase-8cfa1",
    storageBucket:"studybase-8cfa1.firebasestorage.app",
    messagingSenderId:"434992387793",
    appId:"1:434992387793:web:e5bcae8cad63b4eb6f17f0"
  };
  const auth = getAuth(initializeApp(cfg));

  onAuthStateChanged(auth, async user => {
    const isGuest = sessionStorage.getItem('studybase_guest') === '1';
    if (user) {
      const email = user.email || '';
      const uid   = user.uid;

      // Use the displayName stored at sign-up (updateProfile), fall back to
      // formatting the email prefix if no name was ever set
      const displayName = user.displayName ||
        email.split('@')[0].split('.').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');

      // Force-refresh token to get the latest role / status claims.
      // Missing status must not default to 'active' — that is how a
      // signup whose registerRole call failed looked fully approved here.
      let role = '', status = '';
      try {
        const token  = await user.getIdTokenResult(true);
        role   = token.claims.role   || '';
        status = token.claims.status || '';
      } catch (e) {
        status = '';
      }

      if (status === 'rejected') {
        window.location.href = 'waiting.html';
        return;
      }

      localStorage.setItem('studybase_display_name', displayName);
      localStorage.setItem('studybase_email', email);
      localStorage.setItem('studybase_uid', uid);
      if (!localStorage.getItem('studybase_member_since'))
        localStorage.setItem('studybase_member_since', new Date().toISOString());

      const effectiveStatus = status === 'active' ? 'active' : (status || 'pending');
      if (typeof applyProfileCache === 'function') applyProfileCache(uid);
      bootProfile(displayName, email, uid, false, role, effectiveStatus);
      if (typeof pullProfile === 'function') {
        pullProfile(uid).then(() => bootProfile(displayName, email, uid, false, role, effectiveStatus));
      }
    } else if (isGuest) {
      window.isGuest = true;
      document.body.classList.add('guest-mode');
      document.getElementById('guest-border').style.display = 'block';
      document.getElementById('guest-nudge').style.display = 'block';
      bootProfile('Guest', '', 'guest', true, 'guest', 'active');
    } else {
      window.location.href = 'login.html';
    }
  });

  window.sbSignOut = () => {
    if (sessionStorage.getItem('studybase_guest') === '1') {
      sessionStorage.removeItem('studybase_guest');
      window.location.href = 'login.html'; return;
    }
    signOut(auth).then(() => window.location.href = 'login.html');
  };
</script>

<script>
// ── Dark mode ──
(function(){
  const on = localStorage.getItem('studybase_dark') === '1';
  if (on) document.body.classList.add('dark');
  const btn = document.getElementById('darkToggle');
  if (btn) btn.textContent = on ? '☀️' : '🌙';
})();
function toggleDark(){
  const on = document.body.classList.toggle('dark');
  localStorage.setItem('studybase_dark', on ? '1' : '0');
  document.getElementById('darkToggle').textContent = on ? '☀️' : '🌙';
}

function getInitials(name){
  return name.split(' ').map(w => w[0] || '').join('').toUpperCase().slice(0, 2);
}

function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function openSignOutPopup(){
  const el = document.getElementById('signOutOverlay');
  if(el) el.classList.add('open');
}
function closeSignOutPopup(){
  const el = document.getElementById('signOutOverlay');
  if(el) el.classList.remove('open');
}
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeSignOutPopup();
});

function showToast(msg, type){
  const c = document.getElementById('sb-toast-c');
  if(!c) return;
  const t = document.createElement('div');
  t.className = 'sb-toast';
  t.textContent = msg;
  if(type === 'error') t.style.borderColor = '#ef4444';
  c.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, 2800);
}

let profileCtx = null;
let editDraft = null;
let photoUploading = false;

function bootProfile(displayName, email, uid, isGuest, role, status){
  const keepEditing = profileCtx && profileCtx.editing && profileCtx.uid === uid;
  profileCtx = {
    displayName, email, uid, isGuest, role, status,
    editing: keepEditing,
    profile: (typeof readCachedProfile === 'function') ? readCachedProfile(uid) : { photoUrl:'', enabledSubjects: [], enabledClasses: [] }
  };
  if(!keepEditing) editDraft = null;
  buildProfile();
}

function formatDate(iso){
  if (!iso) return 'Unknown';
  try { return new Date(iso).toLocaleDateString('en-AU', {day:'numeric',month:'long',year:'numeric'}); }
  catch(e) { return 'Unknown'; }
}

function getTopics(s){
  const key = s.storageKey || (s.id + '_topics');
  try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) { return []; }
}

// Returns a styled badge for the user's role + status
function roleBadge(role, status) {
  if (status === 'pending') {
    return `<span class="profile-badge badge-pending">⏳ Pending approval (${role})</span>`;
  }
  const map = {
    teacher: `<span class="profile-badge badge-teacher">🎓 Teacher</span>`,
    dev:     `<span class="profile-badge badge-dev">⚙ Dev</span>`,
    student: `<span class="profile-badge badge-student">🎒 Student</span>`,
  };
  return map[role] || `<span class="profile-badge badge-student">🎒 Student</span>`;
}

function canEditClasses(role){
  return role === 'teacher' || role === 'dev';
}

function startEdit(){
  if(!profileCtx || profileCtx.isGuest) return;
  const p = profileCtx.profile || defaultProfile(profileCtx.uid);
  editDraft = {
    photoUrl: p.photoUrl || '',
    enabledSubjects: (p.enabledSubjects || allSubjectIds()).slice(),
    enabledClasses: (p.enabledClasses || allClassIds()).slice()
  };
  profileCtx.editing = true;
  buildProfile();
}

function cancelEdit(){
  editDraft = null;
  photoUploading = false;
  if(profileCtx) profileCtx.editing = false;
  buildProfile();
}

function toggleDraftId(listName, id, on){
  if(!editDraft) return;
  const list = new Set(editDraft[listName] || []);
  if(on) list.add(id); else list.delete(id);
  editDraft[listName] = [...list];
}

function saveEdit(){
  if(!profileCtx || profileCtx.isGuest || !editDraft) return;
  const next = Object.assign({}, profileCtx.profile, {
    photoUrl: editDraft.photoUrl || '',
    enabledSubjects: editDraft.enabledSubjects.slice(),
    enabledClasses: editDraft.enabledClasses.slice(),
    knownSubjectIds: allSubjectIds(),
    knownClassIds: allClassIds()
  });
  profileCtx.profile = pushProfile(profileCtx.uid, next);
  profileCtx.editing = false;
  editDraft = null;
  showToast('Profile saved');
  buildProfile();
}

async function onProfilePhotoPicked(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file || !editDraft) return;
  if(!file.type.startsWith('image/')){ showToast('Please choose an image', 'error'); return; }
  photoUploading = true;
  buildProfile();
  try {
    editDraft.photoUrl = await uploadProfilePhoto(file);
    showToast('Photo uploaded');
  } catch(e) {
    showToast(e.message || 'Photo upload failed', 'error');
  }
  photoUploading = false;
  buildProfile();
}

function avatarHtml(photoUrl, initials, color, editing){
  const inner = photoUrl
    ? `<img src="${esc(photoUrl)}" alt="">`
    : esc(initials || '?');
  if(!editing) return `<div class="profile-avatar" style="background:${color}">${inner}</div>`;
  return `<div class="avatar-edit">
    <div class="profile-avatar" style="background:${color}">${inner}</div>
    <button type="button" class="avatar-change" ${photoUploading ? 'disabled' : ''} onclick="document.getElementById('profilePhotoInput').click()">
      ${photoUploading ? 'Uploading…' : 'Change photo'}
    </button>
  </div>`;
}

function filterCheckList(input, listId){
  const needle = (input.value || '').trim().toLowerCase();
  const list = document.getElementById(listId);
  if(!list) return;
  let shown = 0;
  list.querySelectorAll('.check-row').forEach(row => {
    const hay = (row.getAttribute('data-search') || '').toLowerCase();
    const match = !needle || hay.includes(needle);
    row.style.display = match ? '' : 'none';
    if(match) shown++;
  });
  const empty = list.querySelector('.check-empty');
  if(empty) empty.style.display = shown ? 'none' : 'block';
}

function subjectChecksHtml(enabled){
  const subjects = (typeof subjectsData !== 'undefined') ? (subjectsData.subjects || []) : [];
  const on = new Set(enabled || []);
  if(!subjects.length) return '<div style="font-size:13px;color:var(--muted2)">No subjects configured.</div>';
  return `<p class="check-hint">Checked subjects show on your hub.</p>
    <input class="check-search" type="search" placeholder="Search subjects…" aria-label="Search subjects" oninput="filterCheckList(this,'subjectCheckList')">
    <div class="check-list" id="subjectCheckList">${subjects.map(s => `
      <label class="check-row" data-search="${esc((s.name || '') + ' ' + (s.id || ''))}">
        <input type="checkbox" ${on.has(s.id) ? 'checked' : ''} onchange="toggleDraftId('enabledSubjects','${s.id}',this.checked)">
        <span class="subj-link-dot" style="background:${s.colour}"></span>
        <span class="subj-link-name">${s.emoji || ''} ${esc(s.name)}</span>
        <span class="check-row-id">${esc(s.id)}</span>
      </label>`).join('')}
      <div class="check-empty">No subjects match that search.</div>
    </div>`;
}

function classChecksHtml(enabled){
  const classes = (typeof classesData !== 'undefined') ? (classesData.subjects || []) : [];
  const on = new Set(enabled || []);
  if(!classes.length) return '<div style="font-size:13px;color:var(--muted2)">No classes configured.</div>';
  return `<p class="check-hint">Checked classes show on your hub.</p>
    <input class="check-search" type="search" placeholder="Search classes…" aria-label="Search classes" oninput="filterCheckList(this,'classCheckList')">
    <div class="check-list" id="classCheckList">${classes.map(s => {
      const label = (s.name || '') + (s.class ? ' ' + s.class : '') + (s.teacher ? ' ' + s.teacher : '') + ' ' + (s.id || '');
      return `<label class="check-row" data-search="${esc(label)}">
        <input type="checkbox" ${on.has(s.id) ? 'checked' : ''} onchange="toggleDraftId('enabledClasses','${esc(s.id)}',this.checked)">
        <span class="subj-link-dot" style="background:${s.colour}"></span>
        <span class="subj-link-name">${s.emoji || ''} ${esc(s.name)}${s.class ? ' · ' + esc(s.class) : ''}</span>
        <span class="check-row-id">${esc(s.id)}</span>
      </label>`;
    }).join('')}
      <div class="check-empty">No classes match that search.</div>
    </div>`;
}

function buildProfile() {
  if(!profileCtx) return;
  const { displayName, email, uid, isGuest, role, status, editing, profile } = profileCtx;
  const subjects = (typeof subjectsData !== 'undefined') ? (subjectsData.subjects || []) : [];
  const enabledSet = new Set((profile && profile.enabledSubjects) || subjects.map(s => s.id));

  let totalTopics = 0, mostActive = null, mostActiveCount = 0;
  subjects.forEach(s => {
    const all  = getTopics(s);
    const mine = uid === 'guest' ? all : all.filter(t => !t.addedBy || t.addedBy === uid);
    totalTopics += mine.length;
    if (mine.length > mostActiveCount) { mostActiveCount = mine.length; mostActive = s; }
  });

  const statsKey = 'studybase_fc_stats_' + uid;
  let fcStats = {correct:0,close:0,incorrect:0,total:0};
  try { fcStats = JSON.parse(localStorage.getItem(statsKey) || '{}'); } catch(e) {}
  const fcTotal     = fcStats.total     || 0;
  const fcCorrect   = fcStats.correct   || 0;
  const fcClose     = fcStats.close     || 0;
  const fcIncorrect = fcStats.incorrect || 0;
  const accuracy    = fcTotal > 0 ? Math.round((fcCorrect / fcTotal) * 100) : 0;

  const memberSince = formatDate(localStorage.getItem('studybase_member_since'));
  const initials    = getInitials(displayName);
  const avatarColor = isGuest ? '#6b7280' : (subjects[0]?.colour || '#f59e0b');
  const photoUrl    = editing ? (editDraft && editDraft.photoUrl) : (profile && profile.photoUrl);

  const badgesHtml = isGuest
    ? `<span class="profile-badge badge-guest">Guest</span>`
    : roleBadge(role, status);

  const visibleForLinks = subjects.filter(s => enabledSet.has(s.id));
  const subjLinksHtml = visibleForLinks.length
    ? visibleForLinks.map(s => {
        const all  = getTopics(s);
        const mine = uid === 'guest' ? all : all.filter(t => !t.addedBy || t.addedBy === uid);
        return `<a class="subj-link-item" href="subject/subject.html#${s.id}">
          <div class="subj-link-dot" style="background:${s.colour}"></div>
          <span class="subj-link-name">${s.emoji || ''} ${esc(s.name)}</span>
          <span class="subj-link-count">${mine.length} mine · ${all.length} total</span>
        </a>`;
      }).join('')
    : '<div style="font-size:13px;color:var(--muted2)">No subjects enabled.</div>';

  const barW = n => fcTotal > 0 ? Math.round((n / fcTotal) * 100) : 0;
  const heroActions = `<div class="profile-hero-actions">${
    isGuest ? '' : (editing
      ? `<div class="edit-actions">
          <button type="button" class="btn-save-profile" onclick="saveEdit()" ${photoUploading ? 'disabled' : ''}>Save</button>
          <button type="button" class="btn-cancel-profile" onclick="cancelEdit()">Cancel</button>
        </div>`
      : `<button type="button" class="profile-edit-btn" onclick="startEdit()">Edit</button>`)
  }${editing ? '' : '<button type="button" class="profile-signout" onclick="openSignOutPopup()">Sign out</button>'}</div>`;

  const editPanel = editing ? `
    <div class="profile-card" style="margin-bottom:20px">
      <div class="profile-card-title">Available subjects</div>
      ${subjectChecksHtml(editDraft.enabledSubjects)}
    </div>
    ${canEditClasses(role) ? `
    <div class="profile-card" style="margin-bottom:20px">
      <div class="profile-card-title">Available classes</div>
      ${classChecksHtml(editDraft.enabledClasses)}
    </div>` : ''}` : '';

  document.getElementById('profilePage').innerHTML = `
    <div class="profile-hero">
      ${avatarHtml(photoUrl, initials, avatarColor, editing && !isGuest)}
      <div class="profile-hero-text">
        <div class="profile-name">${esc(displayName)}</div>
        ${email ? `<div class="profile-email">${esc(email)}</div>` : ''}
        <div class="profile-since">Member since ${esc(memberSince)}</div>
        <div class="profile-badges">${badgesHtml}</div>
      </div>
      ${heroActions}
    </div>

    ${editPanel}

    <div class="profile-grid">
      <div class="profile-card">
        <div class="profile-card-title">Study Stats</div>
        <div class="stat-row">
          <span class="stat-label">Topics added</span>
          <span class="stat-val">${totalTopics}</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Subjects</span>
          <span class="stat-val">${visibleForLinks.length}</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Most active subject</span>
          <span class="stat-val" style="font-size:13px">${mostActive ? esc(mostActive.name) : '—'}</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Questions answered</span>
          <span class="stat-val">${fcTotal}</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Accuracy</span>
          <span class="stat-val" style="color:${accuracy>=70?'#22c55e':accuracy>=40?'#f59e0b':'#ef4444'}">${accuracy}%</span>
        </div>
      </div>

      <div class="profile-card">
        <div class="profile-card-title">Flashcard Breakdown</div>
        ${fcTotal === 0
          ? `<div style="font-size:13px;color:var(--muted2);padding:12px 0">No flashcard questions answered yet.</div>`
          : `<div class="fc-breakdown">
              <div class="fc-bar-row">
                <div class="fc-bar-label"><span>Correct</span><span>${fcCorrect}</span></div>
                <div class="fc-bar-track"><div class="fc-bar-fill correct" style="width:${barW(fcCorrect)}%"></div></div>
              </div>
              <div class="fc-bar-row">
                <div class="fc-bar-label"><span>Close</span><span>${fcClose}</span></div>
                <div class="fc-bar-track"><div class="fc-bar-fill close" style="width:${barW(fcClose)}%"></div></div>
              </div>
              <div class="fc-bar-row">
                <div class="fc-bar-label"><span>Incorrect</span><span>${fcIncorrect}</span></div>
                <div class="fc-bar-track"><div class="fc-bar-fill incorrect" style="width:${barW(fcIncorrect)}%"></div></div>
              </div>
            </div>
            <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
              <span style="font-size:12px;color:var(--muted)">Total answered</span>
              <span style="font-size:15px;font-weight:700">${fcTotal}</span>
            </div>
            <button onclick="if(confirm('Reset all flashcard stats?')){localStorage.removeItem('studybase_fc_stats_${uid}');location.reload();}"
              style="margin-top:10px;background:none;border:1px solid var(--border);border-radius:6px;padding:5px 12px;font-family:'Inter',sans-serif;font-size:11px;color:var(--muted);cursor:pointer">
              Reset stats
            </button>`
        }
      </div>
    </div>

    ${editing ? '' : `<div class="profile-card" style="margin-bottom:20px">
      <div class="profile-card-title">Subjects</div>
      <div class="subj-links">${subjLinksHtml}</div>
    </div>`}`;
}

document.getElementById('profilePhotoInput').addEventListener('change', function(){
  onProfilePhotoPicked(this);
});
</script>
</body>
</html>
